name: UB Review Test
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check MINIMAX_API_KEY
        env:
          _HAVE: ${{ secrets.MINIMAX_API_KEY != '' && 'yes' || '' }}
        run: |
          if [ -z "${_HAVE:-}" ]; then
            echo "MINIMAX_API_KEY: MISSING"
          else
            echo "MINIMAX_API_KEY: PRESENT"
          fi
      - name: Run ub-review
        if: env._HAVE == 'yes'
        uses: EffortlessMetrics/ub-review@f0620c358f4a9032d3f832fda92488fd198ab6e9
        with:
          profile: gh-runner
          posting: review
          fail-on-gate: 'false'
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          base: origin/${{ github.base_ref }}
          head: HEAD
          out: target/ub-review
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ub-review-test
          path: target/ub-review
          if-no-files-found: warn
