name: Policy Contracts

on:
  pull_request:
    paths:
      - "policy/**"
      - ".allow/**"
      - ".rails/**"
      - "plans/**"
      - "docs/templates/**"
      - "docs/specs/**"
      - "docs/status/**"
      - ".github/workflows/**"
      - "xtask/**"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cargo-allow
        run: cargo install --locked cargo-allow --version 0.1.10
      - name: Check cargo-allow spec system
        run: |
          cargo-allow doctor --profile spec-system
          cargo-allow check --profile spec-system --mode audit
          cargo-allow worklist --profile spec-system --format json
      - name: Check doc artifacts
        run: cargo run --locked -p xtask -- check-doc-artifacts
      - name: Check docs automation
        run: cargo run --locked -p xtask -- check-docs-automation
      - name: Check package boundary
        run: cargo run --locked -p xtask -- check-package-boundary
      - name: Check CI lane ledger
        run: cargo run --locked -p xtask -- check-ci-lanes
      - name: Check policy bundle
        run: cargo run --locked -p xtask -- check-policy
