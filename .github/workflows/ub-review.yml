name: UB Review

# Standalone advisory ub-review lane (NEVER a required check). The
# deterministic core gate in ci.yml is the ONLY merge blocker; this workflow
# layers LLM review on top and can never flip that verdict: the job is
# continue-on-error, the action runs with fail-on-gate 'false', and no
# branch-protection rule names this workflow. Runs only for same-repo,
# non-draft PRs (fork PRs cannot read the MINIMAX_API_KEY org secret, and
# drafts would burn advisory LLM budget early); the core gate in ci.yml still
# runs for forks and drafts. Superseded runs are cancelled per PR to bound
# advisory cost. pull-requests: write is granted at the job level only, so
# ub-review can post its grouped advisory PR review. Advisory only: no witness
# execution, no source edits, no memory-safety, UB-free, or Miri-clean claims.
#
# This workflow replaces the retired in-job ub-review step that previously
# rode along inside the ci.yml gate job (SPEC-0024 section 4.1).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: ub-review-${{ github.event.pull_request.number }}
  # Advisory lane: a review of a superseded head is pure cost, cancel it.
  cancel-in-progress: true

jobs:
  review:
    name: UB Review (advisory)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
      # Only so ub-review can post its grouped advisory PR review.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so ub-review can diff base..head.
          fetch-depth: 0
          persist-credentials: false
      - name: Run ub-review
        # Pinned to an immutable commit SHA so a re-tag cannot silently change
        # the advisory lane. Bump deliberately and keep the
        # policy/workflow-allowlist.toml pin in sync in the same PR — a
        # dependabot pin bump alone cannot pass the deterministic gate.
        uses: EffortlessMetrics/ub-review@26b1094c2268ae10f2c73463e9c71d78664afae0
        with:
          profile: gh-runner
          posting: review
          fail-on-gate: 'false'
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          base: origin/${{ github.base_ref }}
          head: HEAD
          out: target/ub-review
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ub-review-artifacts
          path: target/ub-review
          if-no-files-found: warn
