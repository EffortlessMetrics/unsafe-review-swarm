name: CI

# Only an explicit coordinator body edit can request native PR proof.
# Draft/Ready/synchronize and unrelated body edits allocate no product job.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  admission:
    name: Verify native PR admission
    if: github.event.action == 'edited' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type == 'User' && github.event.sender.login == 'EffortlessSteven' && github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.request.outputs.admitted }}
      request: ${{ steps.request.outputs.request }}
    steps:
      - name: Verify coordinator request and exact independent review
        id: request
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import datetime as dt
          import json
          import os
          import re
          import signal
          import urllib.request
          from pathlib import Path

          REPO = 'EffortlessMetrics/unsafe-review-swarm'
          COORDINATOR = 'EffortlessSteven'
          SHA = re.compile(r'[0-9a-f]{40}')


          def require(ok, reason):
              if not ok:
                  raise ValueError(reason)


          def stamp(value):
              require(isinstance(value, str), 'missing timestamp')
              return dt.datetime.strptime(value, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=dt.timezone.utc)


          def record(body, kind):
              require(isinstance(body, str), 'missing body')
              prefix = '<!-- unsafe-review-' + kind + ': '
              matches = re.findall(re.escape(prefix) + r'([^\n]+) -->', body)
              require(body.count(prefix) == 1 and len(matches) == 1, 'missing or ambiguous ' + kind)
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      require(key not in result, 'duplicate record field')
                      result[key] = value
                  return result
              value = json.loads(matches[0], object_pairs_hook=unique)
              require(isinstance(value, dict), 'invalid record')
              return value


          def subject(pr):
              require(pr['state'] == 'open' and pr['draft'] is False, 'PR is not open and ready')
              require(pr['head']['repo']['full_name'] == REPO and pr['head']['repo']['fork'] is False,
                      'untrusted head repository')
              require(pr['base']['repo']['full_name'] == REPO and pr['base']['ref'] == 'main', 'unexpected base')
              require(pr['user']['type'] == 'User', 'bot source')
              return dict(repository=REPO, pr=pr['number'], head=pr['head']['sha'], base=pr['base']['sha'])


          def review_authority(api, path, request):
              reviews = []
              for page in range(1, 11):
                  batch = api(path + '/reviews?per_page=100&page=' + str(page))
                  require(isinstance(batch, list), 'unavailable review list')
                  reviews.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise ValueError('review pagination exceeds bound')
              receipts = []
              for review in reviews:
                  if review['user']['login'] != COORDINATOR or review['commit_id'] != request['head']:
                      continue
                  if '<!-- unsafe-review-independent-review-v1: ' not in (review.get('body') or ''):
                      continue
                  receipt = record(review['body'], 'independent-review-v1')
                  if all(receipt.get(k) == request[k] for k in {'repository', 'pr', 'head', 'base'} | {'integration', 'tree'}):
                      receipts.append((review, receipt))
              require(receipts, 'missing independent exact-subject review')
              review, receipt = max(receipts, key=lambda pair: (pair[0]['submitted_at'], pair[0]['id']))
              require(set(receipt) == {'repository', 'pr', 'head', 'base'} | {'integration', 'tree', 'verdict', 'review_kind'}, 'invalid review schema')
              require(review['id'] == request['review_id'] and review['state'] in ('APPROVED', 'COMMENTED')
                      and review['user']['type'] == 'User' and receipt['review_kind'] == 'independent'
                      and receipt['verdict'] == 'approved-for-proof', 'missing, stale, dismissed or adverse approval')
              require(stamp(review['submitted_at']) <= stamp(request['issued_at']), 'request precedes review')
              require(not any(r['user']['login'] == COORDINATOR and r['commit_id'] == request['head']
                              and r['state'] == 'CHANGES_REQUESTED'
                              and stamp(r['submitted_at']) >= stamp(review['submitted_at']) for r in reviews),
                      'native review requests changes')
              return review, receipt


          def admit(event, env, api, now):
              # This is the reviewed workflow program: no caller checkout or shell interpolation.
              require(env['GITHUB_EVENT_NAME'] == 'pull_request' and event.get('action') == 'edited',
                      'not a native PR admission edit')
              require(env['GITHUB_REPOSITORY'] == REPO and env['GITHUB_RUN_ATTEMPT'] == '1', 'wrong repository or replay')
              require(event['sender']['login'] == COORDINATOR and event['sender']['type'] == 'User'
                      and env['GITHUB_ACTOR'] == COORDINATOR and env['GITHUB_TRIGGERING_ACTOR'] == COORDINATOR,
                      'unauthorized coordinator')
              expected = subject(event['pull_request'])
              require(type(expected['pr']) is int and expected['pr'] > 0, 'invalid PR identity')
              require(env['GITHUB_REF'] == 'refs/pull/' + str(expected['pr']) + '/merge', 'not the native merge ref')
              require(SHA.fullmatch(env['GITHUB_SHA']) is not None, 'invalid integration SHA')
              request = record(event['pull_request']['body'], 'admission-v1')
              previous = event.get('changes', {}).get('body', {}).get('from')
              require(isinstance(previous, str), 'body was not changed')
              # An ordinary edit preserving a request cannot authorize another product run.
              if '<!-- unsafe-review-admission-v1: ' in previous:
                  old = record(previous, 'admission-v1')
                  require(old.get('request_id') != request.get('request_id'), 'persistent request replay')
              fields = set(expected) | {'integration', 'tree', 'coordinator', 'request_id', 'review_id', 'issued_at'}
              require(set(request) == fields, 'invalid admission schema')
              require(request['coordinator'] == COORDINATOR, 'request actor mismatch')
              require(isinstance(request['request_id'], str)
                      and re.fullmatch(r'[0-9a-f]{32}', request['request_id']) is not None, 'invalid request nonce')
              require(type(request['review_id']) is int and request['review_id'] > 0, 'missing native review identity')
              require(all(request.get(k) == v for k, v in expected.items()), 'event subject mismatch')
              require(request['integration'] == env['GITHUB_SHA'], 'event integration mismatch')
              require(all(isinstance(request[k], str) and SHA.fullmatch(request[k]) for k in ('head', 'base', 'integration', 'tree')),
                      'invalid subject SHA')
              issued = stamp(request['issued_at'])
              edited = stamp(event['pull_request']['updated_at'])
              require(0 <= (edited - issued).total_seconds() <= 60
                      and 0 <= (now - issued).total_seconds() <= 600, 'expired or future request')
              prefix = '/repos/' + REPO
              path = prefix + '/pulls/' + str(expected['pr'])
              current = api(path)
              require(subject(current) == expected and current['body'] == event['pull_request']['body'], 'stale PR snapshot')
              require(current['mergeable'] is True and current['merge_commit_sha'] == request['integration'], 'stale native integration')
              merge = api(prefix + '/git/commits/' + request['integration'])
              require(merge['sha'] == request['integration'] and merge['tree']['sha'] == request['tree']
                      and [parent['sha'] for parent in merge['parents']] == [request['base'], request['head']],
                      'integration tree or parents mismatch')
              review_authority(api, path, request)
              # Refresh after metadata reads; queued/racing edits cannot retain authority.
              refreshed = api(path)
              require(subject(refreshed) == expected and refreshed['body'] == current['body']
                      and refreshed['merge_commit_sha'] == request['integration'] and refreshed['mergeable'] is True,
                      'subject changed during admission')
              review_authority(api, path, request)
              # Readiness only: immutable central admission executes these exact
              # protected-base owners after allocation, with isolated credentials.
              for owner in ('scripts/ci/check-pr-semantic-review-currentness.py',
                            'scripts/ci/check-pr-review-convergence',
                            'scripts/ci/check-pr-review-convergence-core'):
                  metadata = api(prefix + '/contents/' + owner + '?ref=' + request['base'])
                  require(metadata.get('type') == 'file' and metadata.get('path') == owner
                          and type(metadata.get('size')) is int and 0 < metadata['size'] <= 524288
                          and isinstance(metadata.get('sha'), str) and SHA.fullmatch(metadata['sha']),
                          'protected-base review owner unavailable')
              return request


          def public_api(path):
              # Public metadata only. No token, secret, credential or permission expansion.
              request = urllib.request.Request('https://api.github.com' + path,
                  headers={'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read(2_000_001)
              require(len(raw) <= 2_000_000, 'oversized API response')
              return json.loads(raw)


          if __name__ == '__main__':
              def expired(signum, frame):
                  raise TimeoutError('metadata admission deadline exceeded')
              signal.signal(signal.SIGALRM, expired)
              signal.alarm(120)
              try:
                  event_path = Path(os.environ['GITHUB_EVENT_PATH'])
                  require(event_path.stat().st_size <= 1048576, 'oversized native event')
                  request = admit(json.loads(event_path.read_text()), os.environ, public_api,
                                  dt.datetime.now(dt.timezone.utc))
                  # No result is emitted until every readiness and authority
                  # check succeeds. The central hook must independently recheck.
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write('admitted=true\nrequest=' + json.dumps(request, separators=(',', ':')) + '\n')
              except Exception:
                  raise SystemExit('::error::native admission refused or protected-base prerequisite unavailable')
              finally:
                  signal.alarm(0)
          PYTHON

  proof:
    name: Admitted Rust proof
    needs: admission
    if: needs.admission.result == 'success' && needs.admission.outputs.admitted == 'true'
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    uses: EffortlessMetrics/em-ci-workflows/.github/workflows/rust.yml@8ff77e5876b4a7808a58e053aa6248b1020e02d0
    with:
      profile: standard
      force_hosted: false
      script: .ci/run.sh
      fetch_depth: 0
      proof_admission: native-review-v1
      whole_run_deadline: native-run-1200s
      upload_artifacts: true
      artifact_lane: failure-diagnostics

  unsafe-review-rust-result:
    name: Unsafe Review Rust Result
    needs: [admission, proof]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require admitted exact native product result
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          ADMITTED: ${{ needs.admission.outputs.admitted }}
          PROOF_RESULT: ${{ needs.proof.result }}
          EVIDENCE: ${{ needs.proof.outputs.evidence }}
          RECEIPT_NAME: ${{ needs.proof.outputs.receipt_name }}
          ADMISSION_REQUEST: ${{ needs.admission.outputs.request }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import datetime as dt
          import json
          import os
          import re
          import signal
          import urllib.request
          from pathlib import Path

          REPO = 'EffortlessMetrics/unsafe-review-swarm'
          COORDINATOR = 'EffortlessSteven'
          SHA = re.compile(r'[0-9a-f]{40}')


          def require(ok, reason):
              if not ok:
                  raise ValueError(reason)


          def stamp(value):
              require(isinstance(value, str), 'missing timestamp')
              return dt.datetime.strptime(value, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=dt.timezone.utc)


          def record(body, kind):
              require(isinstance(body, str), 'missing body')
              prefix = '<!-- unsafe-review-' + kind + ': '
              matches = re.findall(re.escape(prefix) + r'([^\n]+) -->', body)
              require(body.count(prefix) == 1 and len(matches) == 1, 'missing or ambiguous ' + kind)
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      require(key not in result, 'duplicate record field')
                      result[key] = value
                  return result
              value = json.loads(matches[0], object_pairs_hook=unique)
              require(isinstance(value, dict), 'invalid record')
              return value


          def subject(pr):
              require(pr['state'] == 'open' and pr['draft'] is False, 'PR is not open and ready')
              require(pr['head']['repo']['full_name'] == REPO and pr['head']['repo']['fork'] is False,
                      'untrusted head repository')
              require(pr['base']['repo']['full_name'] == REPO and pr['base']['ref'] == 'main', 'unexpected base')
              require(pr['user']['type'] == 'User', 'bot source')
              return dict(repository=REPO, pr=pr['number'], head=pr['head']['sha'], base=pr['base']['sha'])


          def review_authority(api, path, request):
              reviews = []
              for page in range(1, 11):
                  batch = api(path + '/reviews?per_page=100&page=' + str(page))
                  require(isinstance(batch, list), 'unavailable review list')
                  reviews.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise ValueError('review pagination exceeds bound')
              receipts = []
              for review in reviews:
                  if review['user']['login'] != COORDINATOR or review['commit_id'] != request['head']:
                      continue
                  if '<!-- unsafe-review-independent-review-v1: ' not in (review.get('body') or ''):
                      continue
                  receipt = record(review['body'], 'independent-review-v1')
                  if all(receipt.get(k) == request[k] for k in {'repository', 'pr', 'head', 'base'} | {'integration', 'tree'}):
                      receipts.append((review, receipt))
              require(receipts, 'missing independent exact-subject review')
              review, receipt = max(receipts, key=lambda pair: (pair[0]['submitted_at'], pair[0]['id']))
              require(set(receipt) == {'repository', 'pr', 'head', 'base'} | {'integration', 'tree', 'verdict', 'review_kind'}, 'invalid review schema')
              require(review['id'] == request['review_id'] and review['state'] in ('APPROVED', 'COMMENTED')
                      and review['user']['type'] == 'User' and receipt['review_kind'] == 'independent'
                      and receipt['verdict'] == 'approved-for-proof', 'missing, stale, dismissed or adverse approval')
              require(stamp(review['submitted_at']) <= stamp(request['issued_at']), 'request precedes review')
              require(not any(r['user']['login'] == COORDINATOR and r['commit_id'] == request['head']
                              and r['state'] == 'CHANGES_REQUESTED'
                              and stamp(r['submitted_at']) >= stamp(review['submitted_at']) for r in reviews),
                      'native review requests changes')
              return review, receipt


          def public_api(path):
              # Public metadata only. No token, secret, credential or permission expansion.
              request = urllib.request.Request('https://api.github.com' + path,
                  headers={'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read(2_000_001)
              require(len(raw) <= 2_000_000, 'oversized API response')
              return json.loads(raw)


          # Final result refreshes authority without reapplying the short admission TTL:
          # the bounded product phase can outlast the short request freshness window.
          assert os.environ['ADMISSION_RESULT'] == 'success'
          assert os.environ['ADMITTED'] == 'true'
          assert os.environ['PROOF_RESULT'] == 'success'
          evidence = json.loads(os.environ['EVIDENCE'])
          assert evidence['schema'] == 'em-ci-rust-result.v1'
          assert evidence['repository'] == os.environ['GITHUB_REPOSITORY']
          assert evidence['sha'] == os.environ['GITHUB_SHA']
          assert evidence['run_id'] == os.environ['GITHUB_RUN_ID']
          assert evidence['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert evidence['profile'] == 'standard'
          assert evidence['result'] == 'success' and evidence['proof_outcome'] == 'success'
          assert evidence['proof_entered_at'] and os.environ['RECEIPT_NAME']
          request = json.loads(os.environ['ADMISSION_REQUEST'])
          path = '/repos/' + REPO + '/pulls/' + str(request['pr'])
          current = public_api(path)
          expected = {k: request[k] for k in ('repository', 'pr', 'head', 'base')}
          require(subject(current) == expected and current['merge_commit_sha'] == request['integration']
                  and current['mergeable'] is True and request['integration'] == os.environ['GITHUB_SHA'],
                  'final subject drift')
          require(record(current['body'], 'admission-v1') == request, 'request was revoked')
          review_authority(public_api, path, request)
          PYTHON
