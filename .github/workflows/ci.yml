name: CI

# Product proof is admitted only at the pre-merge queue boundary or an explicit
# owner dispatch on the exact branch. Draft/Ready/synchronize run no product job.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      admit:
        description: Explicitly admit this exact source to pre-merge product proof
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsafe-review-rust-result:
    name: Unsafe Review Rust Result
    if: github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.admit)
    uses: EffortlessMetrics/em-ci-workflows/.github/workflows/rust.yml@a3125de962a74e7ec2e127d41d7532f66c69334d
    with:
      profile: standard
      force_hosted: false
      script: .ci/run.sh
      fetch_depth: 0
