# Bootstrap late-admission guard: no product work on draft/Ready/synchronize.
# Uses the existing legacy floor, not the allowance-pending central 8ff route.
name: CI

# One tight CI gate, single required check, self-hosted-primary with
# GitHub-hosted overflow. A minimal `route` job (NOT a required check) decides
# the gate runner: if a trusted idle self-hosted runner from the EM `em-ci`
# fleet is available it absorbs the run; otherwise (no idle capacity, missing
# runner-read token, org-runner API failure, or a fork PR) the gate overflows to
# zero-config `ubuntu-latest`. The owned fleet handles the bulk; gh-hosted is the
# burst/capacity-gap/fork fallback. There is exactly ONE required status check
# (`Unsafe Review Rust Result`); the router never blocks the merge and there is
# no per-size routing (whatever idle trusted self-hosted runner catches it).
#
# The gate job is the deterministic core floor (fmt + clippy + test + rustdoc
# + `xtask check-pr`) and nothing else. The advisory ub-review LLM lane runs as its own
# standalone non-blocking workflow (.github/workflows/ub-review.yml); it is not
# part of this job and can never flip the gate verdict:
#
#   0. route (advisory, ubuntu-latest): pick self-hosted (idle trusted em-ci
#      runner) else ubuntu-latest overflow; emit a runs-on value + runner_kind.
#   1. Shared setup once (checkout fetch-depth 0, toolchain 1.98, rust-cache
#      with the shared ci-gate cache key also used by cache-warm.yml).
#   2. Fast precontext (~seconds, no full build): a runner-kind-aware disk/scratch
#      check, then cargo fmt --check plus repo/PR facts written to
#      target/ci-core/precontext.md, AND the deterministic core gate
#      (`xtask check-pr`) launched in the BACKGROUND sharing the workspace target
#      dir. cargo's target-dir lock serialises any concurrent cargo invocation
#      safely (no corruption; worst case a little extra wall-clock), so this
#      avoids doubling disk with a second target dir and works on both runner
#      kinds.
#   3. Final assert: wait for this run's backgrounded core gate, surface a
#      bounded closed-vocabulary step-status summary, and fail the job iff its
#      exit code != 0. The single required check reflects ONLY the deterministic
#      core verdict.
#   4. Failure evidence: on a non-zero core verdict only, upload the bounded
#      allowlisted summary, command/commit/exit/path metadata, and sanitized
#      structured test-diagnostics. The upload is always attempted, non-fatal,
#      short-retention, and never reads or includes core.log.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Names the verdict file for this exact Actions run/attempt. A cancelled or
  # retried background process therefore cannot satisfy a later run's wait.
  CORE_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  admission:
    name: Verify native PR admission
    if: github.event.action == 'edited' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type == 'User' && github.event.sender.login == 'EffortlessSteven' && github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.request.outputs.admitted }}
      request: ${{ steps.request.outputs.request }}
    steps:
      - name: Verify coordinator request and exact independent review
        id: request
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import datetime as dt
          import json
          import os
          import re
          import signal
          import urllib.request
          from pathlib import Path

          REPO = 'EffortlessMetrics/unsafe-review-swarm'
          COORDINATOR = 'EffortlessSteven'
          SHA = re.compile(r'[0-9a-f]{40}')


          def require(ok, reason):
              if not ok:
                  raise ValueError(reason)


          def stamp(value):
              require(isinstance(value, str), 'missing timestamp')
              return dt.datetime.strptime(value, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=dt.timezone.utc)


          def record(body, kind):
              require(isinstance(body, str), 'missing body')
              prefix = '<!-- unsafe-review-' + kind + ': '
              matches = re.findall(re.escape(prefix) + r'([^\n]+) -->', body)
              require(body.count(prefix) == 1 and len(matches) == 1, 'missing or ambiguous ' + kind)
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      require(key not in result, 'duplicate record field')
                      result[key] = value
                  return result
              value = json.loads(matches[0], object_pairs_hook=unique)
              require(isinstance(value, dict), 'invalid record')
              return value


          def subject(pr):
              require(pr['state'] == 'open' and pr['draft'] is False, 'PR is not open and ready')
              require(pr['head']['repo']['full_name'] == REPO and pr['head']['repo']['fork'] is False,
                      'untrusted head repository')
              require(pr['base']['repo']['full_name'] == REPO and pr['base']['ref'] == 'main', 'unexpected base')
              require(pr['user']['type'] == 'User', 'bot source')
              return dict(repository=REPO, pr=pr['number'], head=pr['head']['sha'], base=pr['base']['sha'])


          def review_authority(api, path, request):
              reviews = []
              for page in range(1, 11):
                  batch = api(path + '/reviews?per_page=100&page=' + str(page))
                  require(isinstance(batch, list), 'unavailable review list')
                  reviews.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise ValueError('review pagination exceeds bound')
              receipts = []
              for review in reviews:
                  if review['user']['login'] != COORDINATOR or review['commit_id'] != request['head']:
                      continue
                  if '<!-- unsafe-review-independent-review-v1: ' not in (review.get('body') or ''):
                      continue
                  receipt = record(review['body'], 'independent-review-v1')
                  if all(receipt.get(k) == request[k] for k in {'repository', 'pr', 'head', 'base'} | {'integration', 'tree'}):
                      receipts.append((review, receipt))
              require(receipts, 'missing independent exact-subject review')
              review, receipt = max(receipts, key=lambda pair: (pair[0]['submitted_at'], pair[0]['id']))
              require(set(receipt) == {'repository', 'pr', 'head', 'base'} | {'integration', 'tree', 'verdict', 'review_kind'}, 'invalid review schema')
              require(review['id'] == request['review_id'] and review['state'] in ('APPROVED', 'COMMENTED')
                      and review['user']['type'] == 'User' and receipt['review_kind'] == 'independent'
                      and receipt['verdict'] == 'approved-for-proof', 'missing, stale, dismissed or adverse approval')
              require(stamp(review['submitted_at']) <= stamp(request['issued_at']), 'request precedes review')
              require(not any(r['user']['login'] == COORDINATOR and r['commit_id'] == request['head']
                              and r['state'] == 'CHANGES_REQUESTED'
                              and stamp(r['submitted_at']) >= stamp(review['submitted_at']) for r in reviews),
                      'native review requests changes')
              return review, receipt


          def admit(event, env, api, now):
              # This is the reviewed workflow program: no caller checkout or shell interpolation.
              require(env['GITHUB_EVENT_NAME'] == 'pull_request' and event.get('action') == 'edited',
                      'not a native PR admission edit')
              require(env['GITHUB_REPOSITORY'] == REPO and env['GITHUB_RUN_ATTEMPT'] == '1', 'wrong repository or replay')
              require(event['sender']['login'] == COORDINATOR and event['sender']['type'] == 'User'
                      and env['GITHUB_ACTOR'] == COORDINATOR and env['GITHUB_TRIGGERING_ACTOR'] == COORDINATOR,
                      'unauthorized coordinator')
              expected = subject(event['pull_request'])
              require(type(expected['pr']) is int and expected['pr'] > 0, 'invalid PR identity')
              require(env['GITHUB_REF'] == 'refs/pull/' + str(expected['pr']) + '/merge', 'not the native merge ref')
              require(SHA.fullmatch(env['GITHUB_SHA']) is not None, 'invalid integration SHA')
              request = record(event['pull_request']['body'], 'admission-v1')
              previous = event.get('changes', {}).get('body', {}).get('from')
              require(isinstance(previous, str), 'body was not changed')
              # An ordinary edit preserving a request cannot authorize another product run.
              if '<!-- unsafe-review-admission-v1: ' in previous:
                  old = record(previous, 'admission-v1')
                  require(old.get('request_id') != request.get('request_id'), 'persistent request replay')
              fields = set(expected) | {'integration', 'tree', 'coordinator', 'request_id', 'review_id', 'issued_at'}
              require(set(request) == fields, 'invalid admission schema')
              require(request['coordinator'] == COORDINATOR, 'request actor mismatch')
              require(isinstance(request['request_id'], str)
                      and re.fullmatch(r'[0-9a-f]{32}', request['request_id']) is not None, 'invalid request nonce')
              require(type(request['review_id']) is int and request['review_id'] > 0, 'missing native review identity')
              require(all(request.get(k) == v for k, v in expected.items()), 'event subject mismatch')
              require(request['integration'] == env['GITHUB_SHA'], 'event integration mismatch')
              require(all(isinstance(request[k], str) and SHA.fullmatch(request[k]) for k in ('head', 'base', 'integration', 'tree')),
                      'invalid subject SHA')
              issued = stamp(request['issued_at'])
              edited = stamp(event['pull_request']['updated_at'])
              require(0 <= (edited - issued).total_seconds() <= 60
                      and 0 <= (now - issued).total_seconds() <= 600, 'expired or future request')
              prefix = '/repos/' + REPO
              path = prefix + '/pulls/' + str(expected['pr'])
              current = api(path)
              require(subject(current) == expected and current['body'] == event['pull_request']['body'], 'stale PR snapshot')
              require(current['mergeable'] is True and current['merge_commit_sha'] == request['integration'], 'stale native integration')
              merge = api(prefix + '/git/commits/' + request['integration'])
              require(merge['sha'] == request['integration'] and merge['tree']['sha'] == request['tree']
                      and [parent['sha'] for parent in merge['parents']] == [request['base'], request['head']],
                      'integration tree or parents mismatch')
              review_authority(api, path, request)
              # Refresh after metadata reads; queued/racing edits cannot retain authority.
              refreshed = api(path)
              require(subject(refreshed) == expected and refreshed['body'] == current['body']
                      and refreshed['merge_commit_sha'] == request['integration'] and refreshed['mergeable'] is True,
                      'subject changed during admission')
              review_authority(api, path, request)
              return request


          def public_api(path):
              # Public metadata only. No token, secret, credential or permission expansion.
              request = urllib.request.Request('https://api.github.com' + path,
                  headers={'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read(2_000_001)
              require(len(raw) <= 2_000_000, 'oversized API response')
              return json.loads(raw)


          if __name__ == '__main__':
              def expired(signum, frame):
                  raise TimeoutError('metadata admission deadline exceeded')
              signal.signal(signal.SIGALRM, expired)
              signal.alarm(120)
              try:
                  event_path = Path(os.environ['GITHUB_EVENT_PATH'])
                  require(event_path.stat().st_size <= 1048576, 'oversized native event')
                  request = admit(json.loads(event_path.read_text()), os.environ, public_api,
                                  dt.datetime.now(dt.timezone.utc))
                  # No result is emitted until every native authority check succeeds.
                  # The legacy proof job refreshes authority before product entry.
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write('admitted=true\nrequest=' + json.dumps(request, separators=(',', ':')) + '\n')
              except Exception:
                  raise SystemExit('::error::bootstrap native request refused')
              finally:
                  signal.alarm(0)
          PYTHON

  # Minimal capacity router (NOT a required check). It decides where the single
  # gate runs: self-hosted primary when the owned fleet has idle trusted capacity,
  # gh-hosted overflow otherwise. It only reads org runner state and emits a
  # runs-on value; it never gates the merge and never runs the suite.
  route:
    name: Route CI runner
    needs: admission
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # `runner` is a JSON value the gate consumes via fromJSON: either a JSON
      # string ("ubuntu-latest") or a JSON array of self-hosted labels. Both are
      # valid `runs-on` shapes. `runner_kind` lets the gate branch disk/scratch
      # handling (github vs self-hosted).
      runner: ${{ steps.route.outputs.runner }}
      runner_kind: ${{ steps.route.outputs.runner_kind }}
    steps:
      - name: Decide gate runner (self-hosted primary, gh-hosted overflow)
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
          ADMISSION_RESULT: ${{ needs.admission.result }}
          ADMITTED: ${{ needs.admission.outputs.admitted }}
        run: |
          set -uo pipefail
          # gh-hosted overflow is emitted as a JSON string; self-hosted as a JSON
          # array of the shared em-ci trust labels. We match the shared group label
          # set only (NOT any per-size label) so whatever idle trusted runner is
          # free catches it.
          GH='"ubuntu-latest"'
          SELF_HOSTED='["self-hosted","linux","x64","em-ci","trusted-pr"]'
          emit() {
            echo "runner=$1" >> "$GITHUB_OUTPUT"
            echo "runner_kind=$2" >> "$GITHUB_OUTPUT"
            echo "route -> $2 ($3)"
          }
          # Routine events allocate only cheap hosted control/result jobs.
          # Never query inventory or select product capacity without admission.
          if [[ "$ADMISSION_RESULT" != success || "$ADMITTED" != true ]]; then
            emit "$GH" github "metadata only: no explicit native admission"
            exit 0
          fi
          # Fork PRs can never use trusted self-hosted runners (untrusted code, no
          # org secrets): always overflow to gh-hosted.
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            emit "$GH" github "fork PR -> gh-hosted overflow"
            exit 0
          fi
          # No runner-read token configured: overflow to gh-hosted.
          if [[ -z "${GH_TOKEN:-}" ]]; then
            emit "$GH" github "EM_RUNNER_READ_TOKEN missing -> gh-hosted overflow"
            exit 0
          fi
          set +e
          RESP="$(gh api "orgs/EffortlessMetrics/actions/runners?per_page=100" 2>route.err)"
          CODE=$?
          set -e
          if [[ $CODE -ne 0 ]]; then
            emit "$GH" github "org runner API failed ($(tr -d '\n' <route.err | head -c 120)) -> gh-hosted overflow"
            exit 0
          fi
          # A trusted idle self-hosted runner is online, not busy, and carries the
          # shared em-ci trusted-pr label set. Any idle size qualifies.
          if jq -e '
            [.runners[]
              | select(.status == "online" and .busy == false)
              | [.labels[].name] as $ls
              | select(($ls | index("self-hosted")) and ($ls | index("linux")) and ($ls | index("x64")) and ($ls | index("em-ci")) and ($ls | index("trusted-pr")))]
            | length > 0' <<<"$RESP" >/dev/null 2>&1; then
            emit "$SELF_HOSTED" self-hosted "idle trusted self-hosted runner available"
          else
            emit "$GH" github "no idle trusted self-hosted capacity -> gh-hosted overflow"
          fi

  unsafe-review-rust-result:
    # Single required check. Success requires native admission/currentness and
    # the mandatory deterministic core gate (final assert step). The advisory ub-review lane
    # lives in the standalone ub-review.yml workflow and can never flip this
    # result. The job name is kept stable for branch protection.
    #
    # runs-on is decided by the router: a self-hosted label array when the owned
    # fleet has idle trusted capacity, else "ubuntu-latest" overflow. fromJSON
    # turns the router's JSON value into either a runs-on string or label array
    # (both valid). The router never blocks the merge; only this gate does.
    name: Unsafe Review Rust Result
    needs: [admission, route]
    if: always()
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 60
    env:
      ADMISSION_RESULT: ${{ needs.admission.result }}
      ADMITTED: ${{ needs.admission.outputs.admitted }}
      ADMISSION_REQUEST: ${{ needs.admission.outputs.request }}
    permissions:
      contents: read
    steps:
      - name: Require explicit native bootstrap admission
        run: &native_subject_check |
          set -euo pipefail
          [[ "$ADMISSION_RESULT" == success && "$ADMITTED" == true ]] || exit 78
          if [[ "${NATIVE_PHASE:-entry}" == final ]]; then
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            [[ "$(cat "target/ci-core/core_exit-${CORE_RUN_KEY}")" == 0 ]]
          fi
          python3 - <<'PYTHON'
          import datetime as dt
          import json
          import os
          import re
          import signal
          import urllib.request
          from pathlib import Path

          REPO = 'EffortlessMetrics/unsafe-review-swarm'
          COORDINATOR = 'EffortlessSteven'
          SHA = re.compile(r'[0-9a-f]{40}')


          def require(ok, reason):
              if not ok:
                  raise ValueError(reason)


          def stamp(value):
              require(isinstance(value, str), 'missing timestamp')
              return dt.datetime.strptime(value, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=dt.timezone.utc)


          def record(body, kind):
              require(isinstance(body, str), 'missing body')
              prefix = '<!-- unsafe-review-' + kind + ': '
              matches = re.findall(re.escape(prefix) + r'([^\n]+) -->', body)
              require(body.count(prefix) == 1 and len(matches) == 1, 'missing or ambiguous ' + kind)
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      require(key not in result, 'duplicate record field')
                      result[key] = value
                  return result
              value = json.loads(matches[0], object_pairs_hook=unique)
              require(isinstance(value, dict), 'invalid record')
              return value


          def subject(pr):
              require(pr['state'] == 'open' and pr['draft'] is False, 'PR is not open and ready')
              require(pr['head']['repo']['full_name'] == REPO and pr['head']['repo']['fork'] is False,
                      'untrusted head repository')
              require(pr['base']['repo']['full_name'] == REPO and pr['base']['ref'] == 'main', 'unexpected base')
              require(pr['user']['type'] == 'User', 'bot source')
              return dict(repository=REPO, pr=pr['number'], head=pr['head']['sha'], base=pr['base']['sha'])


          def review_authority(api, path, request):
              reviews = []
              for page in range(1, 11):
                  batch = api(path + '/reviews?per_page=100&page=' + str(page))
                  require(isinstance(batch, list), 'unavailable review list')
                  reviews.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise ValueError('review pagination exceeds bound')
              receipts = []
              for review in reviews:
                  if review['user']['login'] != COORDINATOR or review['commit_id'] != request['head']:
                      continue
                  if '<!-- unsafe-review-independent-review-v1: ' not in (review.get('body') or ''):
                      continue
                  receipt = record(review['body'], 'independent-review-v1')
                  if all(receipt.get(k) == request[k] for k in {'repository', 'pr', 'head', 'base'} | {'integration', 'tree'}):
                      receipts.append((review, receipt))
              require(receipts, 'missing independent exact-subject review')
              review, receipt = max(receipts, key=lambda pair: (pair[0]['submitted_at'], pair[0]['id']))
              require(set(receipt) == {'repository', 'pr', 'head', 'base'} | {'integration', 'tree', 'verdict', 'review_kind'}, 'invalid review schema')
              require(review['id'] == request['review_id'] and review['state'] in ('APPROVED', 'COMMENTED')
                      and review['user']['type'] == 'User' and receipt['review_kind'] == 'independent'
                      and receipt['verdict'] == 'approved-for-proof', 'missing, stale, dismissed or adverse approval')
              require(stamp(review['submitted_at']) <= stamp(request['issued_at']), 'request precedes review')
              require(not any(r['user']['login'] == COORDINATOR and r['commit_id'] == request['head']
                              and r['state'] == 'CHANGES_REQUESTED'
                              and stamp(r['submitted_at']) >= stamp(review['submitted_at']) for r in reviews),
                      'native review requests changes')
              return review, receipt


          def public_api(path):
              # Public metadata only. No token, secret, credential or permission expansion.
              request = urllib.request.Request('https://api.github.com' + path,
                  headers={'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read(2_000_001)
              require(len(raw) <= 2_000_000, 'oversized API response')
              return json.loads(raw)


          def expired(signum, frame):
              raise TimeoutError('bootstrap native refresh deadline exceeded')
          signal.signal(signal.SIGALRM, expired)
          signal.alarm(120)
          require(os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'bootstrap partial rerun is not admission')
          require(os.environ['GITHUB_REPOSITORY'] == REPO
                  and os.environ['GITHUB_ACTOR'] == COORDINATOR
                  and os.environ['GITHUB_TRIGGERING_ACTOR'] == COORDINATOR,
                  'bootstrap coordinator mismatch')
          request = json.loads(os.environ['ADMISSION_REQUEST'])
          path = '/repos/' + REPO + '/pulls/' + str(request['pr'])
          current = public_api(path)
          expected = {k: request[k] for k in ('repository', 'pr', 'head', 'base')}
          require(subject(current) == expected and current['merge_commit_sha'] == request['integration']
                  and current['mergeable'] is True and request['integration'] == os.environ['GITHUB_SHA'],
                  'bootstrap subject drift')
          require(record(current['body'], 'admission-v1') == request, 'request was revoked')
          review_authority(public_api, path, request)
          signal.alarm(0)
          PYTHON
      - uses: actions/checkout@v7
        with:
          # Full history for the diff-scoped test skip and base comparisons.
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy
      # shared-key (#1515 candidate 3): one cache entry family shared by the PR
      # gate lane and the scheduled cache-warm.yml lane, so gh-hosted fallback
      # PR runs restore the entry the weekly warm run saves on main. The id
      # exposes the action's cache-hit output for the advisory floor-time
      # cache_hit_state below.
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: ci-gate
      # Fast precontext + background launch of the deterministic core gate. The
      # disk/scratch handling is runner-kind aware: on gh-hosted overflow we free
      # the big preinstalled SDKs when headroom is low; on self-hosted we leave the
      # gh-only paths alone (they are not present) and instead report headroom and
      # reuse the shared workspace target dir. The cheap repo/PR facts are
      # written first as a durable run record; the full deterministic core
      # gate (fmt + clippy + test + check-pr) is launched in the background
      # sharing the workspace target dir (cargo's lock serialises any overlap
      # safely) and its verdict is the only thing that gates the merge. The
      # precontext facts and floor-time signal below stay advisory: they feed
      # the standalone ub-review workflow's cost-receipt composition and the
      # job summary, never the gate verdict.
      - name: Refresh native authority immediately before product proof
        run: *native_subject_check
      - name: Fast precontext and launch core gate
        id: launch
        env:
          RUNNER_KIND: ${{ needs.route.outputs.runner_kind }}
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          set +e
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 78
          mkdir -p target/ci-core
          core_exit_path="target/ci-core/core_exit-${CORE_RUN_KEY}"
          # A self-hosted workspace may retain untracked target files between
          # runs. Clear the legacy verdict and this exact run's atomic verdict
          # files before launch. A successful run therefore cannot observe stale
          # exit evidence; failure staging is created later under RUNNER_TEMP.
          rm -f target/ci-core/core_exit "$core_exit_path" "${core_exit_path}.tmp"
          : > target/ci-core/step-status.tsv
          if [ "${RUNNER_KIND}" = "self-hosted" ]; then
            # Self-hosted primary: do NOT run the gh disk-free (android/dotnet/ghc/
            # CodeQL are not on the fleet). GC stale per-run scratch dirs before
            # reporting headroom; runs cancelled mid-build skip their cleanup step
            # and orphaned dirs accumulate until the disk guard fails closed.
            # Bounded: -mindepth 1 -maxdepth 1 limits to direct children of each
            # scratch root; -mmin +120 protects dirs newer than 2 h (all workflow
            # timeouts are <=60 min); 2>/dev/null || true is non-fatal on missing
            # paths; never touches worktrees, the repo checkout, or paths outside
            # the scratch mount. Mirrors ripr-swarm#1027. Fixes #1519.
            find /mnt/ci-scratch/cargo-home /mnt/ci-scratch/target /mnt/ci-scratch/tmp \
              -mindepth 1 -maxdepth 1 -mmin +120 -print -exec rm -rf {} + 2>/dev/null || true
            echo "self-hosted runner: reporting headroom; shared workspace target dir reused (cargo lock serialises overlap)."
            df -h . || true
            df -h / || true
          else
            # gh-hosted overflow: concurrent builds should extend time, not crash disk.
            df -h /
            avail_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
            if [ "${avail_gb:-0}" -lt 12 ]; then
              echo "disk guard: low headroom (${avail_gb}G < 12G); freeing. Safe-to-remove on ubuntu-latest: /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL. Reclaim with: sudo rm -rf <those paths>."
              sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
            fi
          fi
          {
            echo "# Deterministic core-gate context"
            echo
            echo "- core gate (gates the merge; running concurrently): the full"
            echo "  deterministic suite —"
            echo "    cargo fmt --all --check"
            echo "    cargo clippy --workspace --all-targets --locked -- -D warnings"
            echo "    cargo run --locked -p xtask -- ci-test"
            echo "    RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --no-deps --locked"
            echo "    cargo run --locked -p xtask -- check-pr"
            echo "- check-pr covers the repo contract: docs, public badges, policy"
            echo "  bundle, support tiers, fixtures, calibration, dogfood manifest,"
            echo "  manual fuzz harness, and tracked generated artifacts."
            echo "- runner: ${RUNNER_KIND:-github}  event: ${GITHUB_EVENT_NAME}  base: ${GITHUB_BASE_REF:-n/a}  sha: ${GITHUB_SHA}"
          } > target/ci-core/precontext.md
          # Record the wall-clock start for the advisory floor-time signal. This
          # timestamp is consumed by the "Assert core gate verdict" step to compute
          # required_floor_wall_seconds. It is purely advisory and never gates the
          # merge; failures here are non-fatal (|| true).
          date +%s > target/ci-core/gate_start || true
          # Cache observability (#1515 candidate 1): rust-cache exposes only a
          # boolean exact-match output, so derive a tri-state here, before the
          # build populates anything: exact hit from the step output; else a
          # populated registry cache dir means a partial restore-key match,
          # else a miss. Advisory only; captured for the floor-time emit and
          # never read by the gate verdict. Failures are non-fatal (|| true).
          cache_hit_state="unknown"
          case "${RUST_CACHE_HIT:-}" in
            true)
              cache_hit_state="hit"
              ;;
            false)
              if [ -n "$(ls -A "${CARGO_HOME:-$HOME/.cargo}/registry/cache" 2>/dev/null)" ]; then
                cache_hit_state="partial"
              else
                cache_hit_state="miss"
              fi
              ;;
          esac
          echo "${cache_hit_state}" > target/ci-core/cache_hit_state || true
          # Diff-scoped test skip (#2171): one shared selector implementation
          # (.github/scripts/select-core-mode.sh, also executed by the xtask
          # contract fixtures) decides the core mode. It prints with-tests
          # unless the diff is non-empty and every changed path is a Markdown
          # document; manifests, lockfiles, toolchain/config files, sources,
          # and unknown, empty, or unavailable diffs all run the full path.
          base_ref="${GITHUB_BASE_REF:-main}"
          core_mode="$(bash .github/scripts/select-core-mode.sh "origin/${base_ref}")"
          printf '%s\n' "$core_mode" > target/ci-core/core_mode
          # Launch the full deterministic core gate in the background, sharing
          # the workspace target dir (cargo's lock serialises any overlap
          # safely). The && chain short-circuits, so the
          # recorded exit code is the first failing command's, or 0 if all pass.
          # Per-step timing (#1515): each step prints its elapsed seconds so the
          # runner-local core.log shows which step dominates. A separate closed-
          # vocabulary status file records only step id, elapsed seconds, and
          # exit status for the retained diagnostic; raw command output never
          # enters the uploaded artifact.
          #
          # Diff-scoped test skip (#1515 candidate 2, #2171): if the PR touches
          # only Markdown documents (per select-core-mode.sh), skip the slow
          # test step. fmt + clippy + rustdoc + check-pr still run — they are
          # the real gate. This cuts ~3-5 min off docs-only PRs.
          (
            _step() {
              local _id="$1" _s _rc _elapsed
              shift
              _s=$(date +%s)
              "$@"
              _rc=$?
              _now=$(date +%s)
              _elapsed=$((_now - _s))
              printf '%s\t%s\t%s\n' "$_id" "$_elapsed" "$_rc" >> target/ci-core/step-status.tsv
              echo "[step-timing] ${_elapsed}s: $*"
              return $_rc
            }
            if [ "$core_mode" = "without-tests" ]; then
              echo "[diff-scope] Markdown-only diff — skipping test step (#2171)"
              _step fmt cargo fmt --all --check \
                && _step clippy cargo clippy --workspace --all-targets --locked -- -D warnings \
                && printf 'test\t0\tskipped\n' >> target/ci-core/step-status.tsv \
                && echo "[diff-scope] skipped test step (Markdown-only PR)" \
                && _step doc env RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked \
                && _step check-pr cargo run --locked -p xtask -- check-pr
            else
              _step fmt cargo fmt --all --check \
                && _step clippy cargo clippy --workspace --all-targets --locked -- -D warnings \
                && _step test env UNSAFE_REVIEW_CI_HANDOFF_DIR="${RUNNER_TEMP}/unsafe-review-structured-${CORE_RUN_KEY}" cargo run --locked -p xtask -- ci-test \
                && _step doc env RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked \
                && _step check-pr cargo run --locked -p xtask -- check-pr
            fi
            core_rc=$?
            printf '%s\n' "$core_rc" > "${core_exit_path}.tmp"
            mv "${core_exit_path}.tmp" "$core_exit_path"
          ) > target/ci-core/core.log 2>&1 &
          echo "launched background core gate (pid $!): fmt + clippy + [test?] + rustdoc + check-pr"
      # Join + final gate assert. Wait for the backgrounded core gate to finish,
      # surface its result in the job summary, and fail the job iff it exited
      # non-zero. The single required check reflects ONLY this deterministic
      # verdict; the advisory ub-review lane runs in the standalone
      # ub-review.yml workflow, so LLM availability or opinion never blocks the
      # merge.
      - name: Assert core gate verdict
        id: core-verdict
        if: ${{ always() && needs.admission.outputs.admitted == 'true' && steps.launch.outcome == 'success' }}
        env:
          RUNNER_KIND: ${{ needs.route.outputs.runner_kind }}
        run: |
          set -uo pipefail
          core_exit_path="target/ci-core/core_exit-${CORE_RUN_KEY}"
          deadline=$((SECONDS + 3000))
          while [ ! -f "$core_exit_path" ]; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "core gate did not finish within the budget" >&2
              printf '124\n' > "${core_exit_path}.tmp"
              mv "${core_exit_path}.tmp" "$core_exit_path"
              break
            fi
            sleep 5
          done
          core_exit="$(cat "$core_exit_path")"
          echo "core_exit=${core_exit}"
          if [ "${core_exit}" != "0" ]; then
            # PR-controlled commands have finished. Discard any predictable
            # staging tree, then create a private unpredictable directory under
            # this job's RUNNER_TEMP. The upload step receives only the exact
            # regular-file paths below, never this directory, so pre-populated
            # workspace extras and core.log symlinks cannot enter the artifact.
            umask 077
            failure_root="${RUNNER_TEMP}/unsafe-review-core-evidence-${CORE_RUN_KEY}"
            rm -rf "$failure_root"
            mkdir -m 700 "$failure_root"
            failure_dir="$(mktemp -d "${failure_root}/staging-XXXXXX")"
            excerpt_path="${failure_dir}/step-status.txt"
            excerpt_tmp="$(mktemp "${failure_dir}/.step-status-XXXXXX")"
            failure_summary_path="${failure_dir}/summary.md"
            failure_metadata_path="${failure_dir}/metadata.json"
            diagnostics_source="${RUNNER_TEMP}/unsafe-review-structured-${CORE_RUN_KEY}/test-diagnostics.json"
            diagnostics_path="${failure_dir}/test-diagnostics.json"
            failure_summary_source="$(mktemp "${failure_dir}/.summary-source-XXXXXX")"
            failure_summary_tmp="$(mktemp "${failure_dir}/.summary-XXXXXX")"
            failure_metadata_tmp="$(mktemp "${failure_dir}/.metadata-XXXXXX")"
            # Build the retained diagnostic exclusively in private staging from
            # the closed-vocabulary step-status sidecar. The predictable
            # workspace excerpt path is never read or written. Only known step
            # ids plus bounded decimal timing/status fields survive; arbitrary
            # command output, bare tokens, PEM blocks, and core.log content have
            # no path into the evidence.
            staging_ready="true"
            if ! {
              printf 'step_id\telapsed_seconds\texit_status\n'
              LC_ALL=C awk -F '\t' '
                NF == 3 &&
                $1 ~ /^(fmt|clippy|test|doc|check-pr)$/ &&
                $2 ~ /^[0-9]+$/ && length($2) <= 10 &&
                (($3 ~ /^[0-9]+$/ && length($3) <= 3) || $3 == "skipped") {
                  print $1 "\t" $2 "\t" $3
                }
              ' target/ci-core/step-status.tsv 2>/dev/null
            } | head -n 80 | head -c 16384 > "$excerpt_tmp"; then
              staging_ready="false"
            elif ! mv "$excerpt_tmp" "$excerpt_path"; then
              staging_ready="false"
            elif [ ! -f "$excerpt_path" ] || [ -L "$excerpt_path" ]; then
              staging_ready="false"
            fi
            if [ "$staging_ready" != "true" ]; then
              echo "core failure evidence staging rejected step-status output" >&2
              rm -rf "$failure_root"
            fi
            if [ "$staging_ready" = "true" ]; then
            # Treat even the sidecar as untrusted after PR-controlled commands
            # have run: accept only its closed mode vocabulary, then select a
            # fixed command string rather than copying file content.
            core_mode="$(cat target/ci-core/core_mode 2>/dev/null || true)"
            case "$core_mode" in
              without-tests)
                core_command="cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- -D warnings && RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --no-deps --locked && cargo run --locked -p xtask -- check-pr"
                ;;
              with-tests)
                core_command="cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo run --locked -p xtask -- ci-test && RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --no-deps --locked && cargo run --locked -p xtask -- check-pr"
                ;;
              *) core_command="deterministic core suite (launch mode unavailable)" ;;
            esac
            # The xtask wrapper owns sanitization. Select only its exact regular
            # file and keep the upload bounded; no runner stream or arbitrary
            # path is copied into the artifact.
            if [ -f "$diagnostics_source" ] && [ ! -L "$diagnostics_source" ] \
              && [ "$(wc -c < "$diagnostics_source" 2>/dev/null || echo 999999)" -le 16385 ]; then
              cp --no-dereference "$diagnostics_source" "$diagnostics_path"
            fi
            if [ ! -f "$diagnostics_path" ] || [ -L "$diagnostics_path" ]; then
              rm -f "$diagnostics_path"
            elif ! cargo run --locked -p xtask -- ci-test-validate "$diagnostics_path"; then
              echo "structured test diagnostics failed schema/integrity validation" >&2
              rm -f "$diagnostics_path"
            fi
            failed_step="$(awk -F '\t' 'NR > 1 && $3 != "0" && $3 != "skipped" { print $1; exit }' "$excerpt_path" 2>/dev/null || true)"
            case "$failed_step" in
              fmt|clippy|test|doc|check-pr) ;;
              *) failed_step="unknown" ;;
            esac
            {
              echo "# Deterministic core-gate failure evidence"
              echo
              echo "- commit: \`${GITHUB_SHA}\`"
              echo "- command: \`${core_command}\`"
              echo "- exit code: \`${core_exit}\`"
              echo "- failed step: \`${failed_step}\`"
              echo "- result path: \`${core_exit_path}\`"
              echo
              echo "## Bounded allowlisted step status"
              echo
              sed 's/^/    /' "$excerpt_path"
              echo
              echo "> Closed-vocabulary diagnostic only. The raw core log is not retained."
            } > "$failure_summary_source"
            # Cap the final uploaded summary itself, including headings and
            # metadata, rather than bounding only its embedded status table.
            head -n 80 "$failure_summary_source" | head -c 16384 > "$failure_summary_tmp"
            printf '{"schema_version":"1.0","commit":"%s","command":"%s","exit_code":%s,"failed_step":"%s","result_path":"%s","summary_path":"%s"}\n' \
              "${GITHUB_SHA}" "${core_command}" "${core_exit}" "${failed_step}" "${core_exit_path}" "$failure_summary_path" > "$failure_metadata_tmp"
            rm -f "$failure_summary_source"
            mv "$failure_summary_tmp" "$failure_summary_path"
            mv "$failure_metadata_tmp" "$failure_metadata_path"
            if [ -f "$failure_summary_path" ] && [ ! -L "$failure_summary_path" ] \
              && [ -f "$failure_metadata_path" ] && [ ! -L "$failure_metadata_path" ]; then
              echo "summary_path=$failure_summary_path" >> "$GITHUB_OUTPUT"
              echo "metadata_path=$failure_metadata_path" >> "$GITHUB_OUTPUT"
              if [ -f "$diagnostics_path" ] && [ ! -L "$diagnostics_path" ]; then
                echo "diagnostics_path=$diagnostics_path" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "core failure evidence staging rejected non-regular output" >&2
              rm -rf "$failure_root"
            fi
            fi
            {
              echo "## Deterministic core gate"
              echo
              echo "Result: FAIL (xtask check-pr exit ${core_exit})"
              if [ "$staging_ready" = "true" ]; then
                echo
                sed 's/^/    /' "$excerpt_path"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Deterministic core gate"
              echo
              echo "Result: PASS (xtask check-pr exit 0)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Advisory floor-time signal: emit wall-time + run context for
          # ub-review's cost receipt (ub-review#336) to compose. This block is
          # wrapped in a subshell with || true so any arithmetic or write failure
          # is STRICTLY non-fatal and cannot change the gate verdict below.
          (
            gate_end="$(date +%s)"
            gate_start="$(cat target/ci-core/gate_start 2>/dev/null || echo "")"
            if [ -n "${gate_start}" ] && [ "${gate_end}" -gt "${gate_start}" ] 2>/dev/null; then
              elapsed=$(( gate_end - gate_start ))
            else
              elapsed="null"
            fi
            fallback_used="false"
            if [ "${RUNNER_KIND:-github}" = "github" ]; then
              fallback_used="true"
            fi
            # Cache hit/miss/partial captured pre-build by the precontext step
            # (#1515); fall back to "unknown" if the capture file is missing or
            # holds an unexpected value.
            cache_hit_state="$(cat target/ci-core/cache_hit_state 2>/dev/null || echo "")"
            case "${cache_hit_state}" in
              hit|partial|miss) ;;
              *) cache_hit_state="unknown" ;;
            esac
            {
              printf '{"required_floor_wall_seconds":%s,"runner_kind":"%s","fallback_used":%s,"cache_hit_state":"%s"}\n' \
                "${elapsed}" "${RUNNER_KIND:-github}" "${fallback_used}" "${cache_hit_state}"
            } > target/ci-core/floor-time.json
            echo "floor-time: required_floor_wall_seconds=${elapsed} runner_kind=${RUNNER_KIND:-github} fallback_used=${fallback_used} cache_hit_state=${cache_hit_state}" \
              >> "$GITHUB_STEP_SUMMARY"
          ) || true
          test "${core_exit}" = "0"
      - name: Upload bounded core-gate failure evidence
        if: >-
          ${{ always() &&
              steps.core-verdict.outputs.summary_path != '' &&
              steps.core-verdict.outputs.metadata_path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: core-gate-failure-evidence
          path: |
            ${{ steps.core-verdict.outputs.summary_path }}
            ${{ steps.core-verdict.outputs.metadata_path }}
            ${{ steps.core-verdict.outputs.diagnostics_path }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Revalidate exact native subject after product proof
        if: success()
        env:
          NATIVE_PHASE: final
        run: *native_subject_check
