# Thin wrapper around the single Action authority at the repository root
# (action.yml, #1878). This file carries no independent implementation: it
# mirrors the root inputs/outputs and delegates to `./`. Edit the contract
# in the root file only.
#
# New callers should use the root action directly; after source promotion:
#   uses: EffortlessMetrics/unsafe-review@v1
#
# Canonical guide: docs/ci/github-action.md
#
# Bundle artifacts verified by the delegated root run (mirrored here so the
# wrapper keeps the same documented surface; the verify logic lives in the
# root action only):
# target/unsafe-review/review-kit.json target/unsafe-review/cards.json
# target/unsafe-review/pr-summary.md target/unsafe-review/github-summary.md
# target/unsafe-review/cards.sarif target/unsafe-review/comment-plan.json
# target/unsafe-review/witness-plan.md target/unsafe-review/receipt-audit.md
# target/unsafe-review/receipt-audit.json target/unsafe-review/policy-report.json
# target/unsafe-review/policy-report.md target/unsafe-review/manual-candidates.json
# target/unsafe-review/lsp.json target/unsafe-review/manual-repair-queue.json
# target/unsafe-review/tokmd-packets.json target/unsafe-review/usefulness-telemetry.json
# target/unsafe-review/repair-queue.json target/unsafe-review/unsafe-review-gate.json

name: unsafe-review first-pr
description: >
  Advisory unsafe-review PR gate (wrapper around the root action). See the
  root action.yml for the contract, trust boundary, and version-skew rules.

inputs:
  base_ref:
    description: >
      Base ref to diff against (e.g. main). Defaults to the repository default
      branch. The action fetches this ref before running first-pr.
    required: false
    default: ${{ github.event.repository.default_branch }}
  version:
    description: >
      unsafe-review crate version to install from crates.io. Pin this to a
      known-good version to prevent silent breakage on new releases.
    required: false
    default: "0.5.0"
  fetch_depth:
    description: >
      Depth passed to `git fetch --depth` when fetching the base ref. The
      default of 100 covers typical PR histories. Increase this for
      repositories with very long histories or shallow clones that fail to
      find the common ancestor.
    required: false
    default: "100"
  out_dir:
    description: >
      Directory for the advisory bundle output. The caller may pass this to an
      artifact upload step.
    required: false
    default: "target/unsafe-review"
  fail_on_new_debt:
    description: >
      When true, exit non-zero if new or worsened coverage gaps are found in
      the diff (maps to exit 1; inherited/baseline gaps never fail). Advisory
      by default — the action never fails on findings unless this is set to
      true by the caller.
    required: false
    default: "false"

outputs:
  bundle_dir:
    description: >
      Absolute path to the advisory bundle directory. Pass this to an artifact
      upload step.
    value: ${{ steps.delegate.outputs.bundle_dir }}
  gate_status:
    description: >
      Contents of the status field from unsafe-review-gate.json — advisory
      metadata describing coverage movement (e.g. "advisory"). This is NOT a
      merge verdict. The caller decides how to use it.
    value: ${{ steps.delegate.outputs.gate_status }}

runs:
  using: composite
  steps:
    - name: Delegate to the root action authority
      id: delegate
      uses: ./
      with:
        base_ref: ${{ inputs.base_ref }}
        version: ${{ inputs.version }}
        fetch_depth: ${{ inputs.fetch_depth }}
        out_dir: ${{ inputs.out_dir }}
        fail_on_new_debt: ${{ inputs.fail_on_new_debt }}
