# Repo-owned structured runner profile for #2133.
# JUnit is nextest's supported machine-readable test-run reporter. Failure
# output is disabled so PR-controlled stdout/stderr never enters the handoff.
[profile.ci.junit]
path = "target/ci-core/nextest-junit.xml"
store-success-output = false
store-failure-output = false
report-skipped = "none"
