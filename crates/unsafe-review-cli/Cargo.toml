[package]
name = "unsafe-review-cli"
version = "0.3.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/unsafe-review-cli"
description = "CLI adapter for unsafe-review"
keywords = ["unsafe", "rust", "cli", "miri", "review"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
unsafe-review-core = { path = "../unsafe-review-core", version = "0.3.8" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "sync", "time"] }
tower-lsp-server = "0.23.0"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[dev-dependencies]
# Only needed to drain `tower_lsp_server::ClientSocket` (a `Stream`) in LSP
# backend tests that drive `Backend::refresh()` end-to-end; not used by
# product code. `executor`/`async-await` (the default features) are not
# needed for `StreamExt`, so they stay off.
futures = { version = "0.3", default-features = false, features = ["std"] }
# Only needed to drive `LspService` (a `tower::Service<Request>`) through a
# real `initialize` request/response in LSP backend tests, so that
# `tower_lsp_server`'s internal server-state gate actually flips to
# `Initialized` (outbound client notifications are otherwise silently
# suppressed pre-initialize). Not used by product code.
tower = { version = "0.5", default-features = false }

[lib]
name = "unsafe_review_cli"
path = "src/lib.rs"

[[bin]]
name = "cargo-unsafe-review"
path = "src/bin/cargo-unsafe-review.rs"

[lints]
workspace = true
