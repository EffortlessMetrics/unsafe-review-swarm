]
surfaces = ["json", "sarif", "human", "agent"]
evidence = "Sanitizer-route and missing-boundary-contract discharge paths confirmed positive. The ffi_safe_wrapper_only_no_cards negative control confirms D1 context discipline: adding only safe code to a file that already has a preexisting unsafe extern C declaration produces zero ReviewCards, proving the detector requires the extern block or unsafe FFI call to appear in the changed lines. The existing not-route fixtures (ffi_same_named_method_not_route, ffi_non_libc_wrapper_call_not_route, ffi_local_libc_module_call_not_route, ffi_inner_libc_path_not_route, ffi_token_in_string_not_route) are correctly calibrated under unsafe_fn_call and are not cross-claimed here. Advisory heuristic only."
