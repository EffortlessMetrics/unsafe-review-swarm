  "zeroed_safe_wrapper_no_cards",
]
surfaces = ["json", "sarif", "human", "agent"]
evidence = "Positive fixtures confirm invalid-value and valid-type detection. Negative controls confirm definition-header rejection (D2 discipline: a safe fn zeroed() definition header is not carded as a mem::zeroed call) and safe-context rejection (D1 discipline: a safe inherent zeroed() method called outside any unsafe scope is not carded as mem::zeroed). Advisory heuristic only."
