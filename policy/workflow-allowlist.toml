[[workflow]]
id = "workflow-0001"
path = ".github/workflows/ci.yml"
permissions = "actions: read, checks: read, contents: read, pull-requests: read"
actions = [
  "EffortlessMetrics/em-ci-workflows/.github/workflows/rust.yml@8ff77e5876b4a7808a58e053aa6248b1020e02d0",
]
reason = "Explicit native PR admission checks a fresh coordinator body request and independent exact head/base/native merge/tree review before calling the active immutable public central Rust standard workflow with its approved contents/actions/checks/pull-requests read scopes and no inherited secrets. Only the reusable proof job receives the three additional read scopes; metadata jobs retain contents: read. Repository scripts retain fmt, clippy, pinned xtask ci-test with doctest parity, rustdoc and check-pr, first-failure propagation, runtime receipts and bounded private failure staging. Consumer polling, physical-runner selection, host cleanup and Cargo cache ownership are retired from this lane. The central standard job retains its 75-minute outer limit and RUNNER_TEMP/cargo-target. Closed native-review-v1 admission and native-run-1200s execution supervision are required; original native created_at is never reset. The failure-diagnostics lane publishes only bounded exact summary/metadata/validated diagnostics with seven-day non-fatal retention. Protected-base review-owner readiness, new-pin live allowance and genuine native runtime/artifact/result qualification remain prerequisites, not source declarations. Advisory ub-review remains independent and unchanged. Cheap hosted metadata jobs check admission and require a matching successful central result receipt; skipped proof is never green. No Draft/Ready/synchronize product execution, settings mutation, dispatch, release or deployment is authorized by this source change."
created = "2026-05-18"
review_after = "2026-09-04"

