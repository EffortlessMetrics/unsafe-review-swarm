[[workflow]]
id = "workflow-0010"
path = ".github/workflows/crates-publish.yml"
permissions = "contents: read"
actions = [
  "actions/checkout@v7",
  "dtolnay/rust-toolchain@1.98",
]
reason = "Manual owner-driven crates.io publish workflow. workflow_dispatch only from main with dry_run default true; ref-guarded (must be dispatched from refs/heads/main); verifies that all three workspace crate versions (unsafe-review-core, unsafe-review-cli, unsafe-review) match each other and the version input before any publish action. Dry-run path runs cargo publish --dry-run for core (succeeds standalone) and cargo package --list for cli/facade (file verification only -- cli/facade dry-run publish is intentionally skipped because their registry resolution fails until the new core version is live on crates.io, which is the documented publish-order caveat). Real publish path requires the CARGO_REGISTRY_TOKEN org secret, checks for its presence before proceeding, publishes in dependency order (core first, then cli with sparse-index settle retry loop up to 10 attempts with 15 s sleep, then facade with the same retry wrapper), and exits non-zero with a clear error on persistent failure. No witness execution, no source edits, no comment posting, no automatic publication on PR or push."
created = "2026-06-14"
review_after = "2026-08-14"

[[workflow]]
id = "workflow-0012"
path = ".github/workflows/ub-review.yml"
permissions = "contents: read, pull-requests: write"
actions = [
  "actions/checkout@v7",
  "EffortlessMetrics/ub-review@55e4fbab879b3a83c31f35cdc9f7e5cd99f0a6c8",
  "actions/upload-artifact@v7",
]
reason = "Standalone advisory ub-review LLM review lane, replacing the retired in-job ub-review step that previously rode inside the ci.yml gate job (SPEC-0024 section 4.1). Runs on pull_request (opened, reopened, ready_for_review, synchronize) for same-repo non-draft PRs only — fork PRs cannot read the MINIMAX_API_KEY org secret, draft PRs would burn advisory LLM budget early, and the deterministic core gate in ci.yml still runs for forks and drafts. Superseded runs are cancelled per PR (concurrency cancel-in-progress) to bound advisory cost. The action is pinned to an immutable commit SHA (gh-runner profile, posting review) and the lane stays strictly advisory: the job is continue-on-error with a bounded 25-minute timeout, the action runs with fail-on-gate 'false', and no branch-protection rule names this workflow, so LLM availability or opinion can never block the merge — the only required check remains 'Unsafe Review Rust Result' from ci.yml. The action receives hosted PR-head metadata separately from the checked-out synthetic merge so revision admission preserves both identities. pull-requests: write is granted at the job level only, solely so ub-review can post its grouped advisory PR review; the run also uploads its artifact bundle via upload-artifact. Pin bumps must update this entry in the same PR (a dependabot pin bump alone cannot pass the deterministic gate). No witness execution, no source edits, no publishing, and no memory-safety, UB-free, or Miri-clean claims."
created = "2026-07-04"
review_after = "2026-10-07"

[[workflow]]
id = "workflow-0013"
path = ".github/workflows/cache-warm.yml"
permissions = "contents: read"
actions = [
  "actions/checkout@v7",
  "dtolnay/rust-toolchain@1.98",
  "Swatinem/rust-cache@v2",
]
reason = "Advisory scheduled rust-cache warmer (unsafe-review-swarm#1515 candidate 3). Runs on a weekly schedule (Monday 04:41 UTC, offset from corpus-backstop 04:00 and fuzz 04:17) and workflow_dispatch only — never on pull_request or push, never a required check, never gates a merge. Restores and re-saves the shared-key ci-gate rust-cache entry on main via a bounded warm-up (cargo fetch --locked plus cargo check --workspace --all-targets --locked, 30-minute job timeout on ubuntu-latest) so the ci.yml gate's gh-hosted fallback PR runs start warm; its workflow-level env mirrors ci.yml because rust-cache folds CARGO*/RUST* env vars into its cache key hash. A failed warm run only marks the scheduled run red and affects nothing else. No witness execution, no source edits, no comment posting, no publishing, no write permissions."
created = "2026-08-10"
review_after = "2026-10-10"

[[workflow]]
