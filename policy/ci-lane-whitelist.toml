schema_version = "1.0"

[[lane]]
id = "default-workspace"
owner = "repo-infra"
intent = "Protect the Rust workspace with one tight CI gate, self-hosted primary via a minimal capacity router with GitHub-hosted overflow: the deterministic xtask check-pr core floor as the only hard blocker; the advisory ub-review LLM lane runs as its own standalone non-blocking workflow (ub-review-advisory lane); an advisory floor-time emit records the core gate wall-time and run context for advisory cost-receipt composition (ub-review#336)"
proof_obligation = "the deterministic core gate cargo run --locked -p xtask -- check-pr passes without witnesses, publishing, source edits, or comment posting, and its verdict is the only thing that gates the merge through the single required Unsafe Review Rust Result check; a minimal route job (not a required check) sends the gate to an idle trusted self-hosted em-ci runner when the owned fleet has capacity and overflows to ubuntu-latest otherwise (bursts, capacity gaps, missing runner-read token, org-runner API failure, or fork PRs), with no per-size self-hosted routing and no separate normalized fallback required check; the advisory floor-time emit (pure run: shell, no new uses: action) writes target/ci-core/floor-time.json and a step-summary line inside a non-fatal subshell after the gate verdict is captured, so it cannot alter the core_exit assert; before launch the workflow removes legacy/stale core_exit state and waits on a run/attempt-keyed atomic verdict; on core failure only, staging is removed and recreated in a private unpredictable RUNNER_TEMP directory, and the always()-guarded non-fatal artifact step uploads exactly two regular files (bounded closed-vocabulary summary plus command/commit/exit/path metadata), never a directory, core.log, workspace extra, or symlink, so evidence retention cannot weaken or replace the core_exit assert"
cost_estimate = "medium"
trigger_policy = "pull_request, push(main), merge_group, workflow_dispatch"
status = "required"
review_after = "2026-07-18"

[[lane]]
id = "ub-review-advisory"
owner = "repo-infra / ci"
intent = "Run advisory ub-review LLM review as a standalone non-blocking workflow layered over the deterministic core gate"
proof_obligation = "the standalone .github/workflows/ub-review.yml workflow runs the EffortlessMetrics/ub-review action pinned to an immutable commit SHA (gh-runner profile) and posts one grouped advisory PR review plus an uploaded artifact bundle while staying strictly advisory: the job is continue-on-error with a bounded timeout and job-scoped pull-requests: write, the action runs with fail-on-gate 'false', and no branch-protection rule names the workflow, so it can never fail the merge — the only required check remains the deterministic Unsafe Review Rust Result gate in ci.yml; the lane is guarded to same-repo non-draft PRs (fork PRs cannot read the MINIMAX_API_KEY org secret, drafts would burn advisory budget) and cancels superseded runs per PR; pin bumps update policy/workflow-allowlist.toml in the same PR; it runs no witnesses, no source edits, no publishing, and makes no memory-safety, UB-free, or Miri-clean claims"
cost_estimate = "medium"
trigger_policy = "pull_request (opened, reopened, ready_for_review, synchronize; same-repo non-draft PRs only, superseded runs cancelled), standalone .github/workflows/ub-review.yml"
status = "advisory"
review_after = "2026-09-04"

[[lane]]
id = "policy-contracts"
owner = "repo-infra"
intent = "Validate source-of-truth ledgers and links"
proof_obligation = "doc artifacts, docs automation, active goals, package boundary, CI lane ledger, and policy bundle parse and resolve"
cost_estimate = "low"
trigger_policy = "pull_request(paths: policy/**, .rails/**, docs/specs/**, docs/status/**, .github/workflows/**, xtask/**), push(main), workflow_dispatch"
status = "advisory"
review_after = "2026-07-01"

[[lane]]
id = "advisory-first-pr"
owner = "repo-infra / ci"
intent = "Render and verify advisory unsafe-review PR packets without blocking on findings"
proof_obligation = "first-pr artifacts parse, align across projections, preserve trust boundary, and remain plan-only/read-only"
cost_estimate = "medium"
trigger_policy = "pull_request, workflow_dispatch"
status = "advisory"
review_after = "2026-07-01"

[[lane]]
id = "source-divergence"
owner = "repo-infra"
intent = "Report source/swarm drift before routine swarm implementation"
proof_obligation = "source-divergence reports source-only and swarm-only commit counts"
cost_estimate = "low"
trigger_policy = "local preflight, workflow_dispatch if promoted"
status = "advisory"
review_after = "2026-07-01"

[[lane]]
id = "coverage"
owner = "repo-infra / coverage"
intent = "Publish Rust test execution-surface telemetry"
proof_obligation = "LCOV is generated by cargo-llvm-cov and uploaded to Codecov as advisory telemetry without threshold gating, PR comment posting, release-readiness gating, witness execution, or unsafe-correctness claims; Codecov upload failures do not fail the lane and the lane is not a required branch-protection gate"
cost_estimate = "medium"
trigger_policy = "push(main), workflow_dispatch; pull_request disabled during swarm CI budget window"
status = "advisory"
review_after = "2026-08-23"

[[lane]]
id = "release-readiness"
owner = "release"
intent = "Run package, dry-run publish, install, first-pr, and support smoke proof before publication"
proof_obligation = "release proof commands pass without publishing unless a trusted release workflow is separately specified"
cost_estimate = "high"
trigger_policy = "workflow_dispatch or release-prep branch only after lane promotion"
status = "deferred"
review_after = "2026-07-01"

[[lane]]
id = "trusted-comment-poster"
owner = "repo-infra / ci"
intent = "Post or update PR comments from a verified comment-plan artifact"
proof_obligation = "trusted workflow verifies comment-plan without rerunning untrusted analysis before using pull-requests write"
cost_estimate = "medium"
trigger_policy = "workflow_run or explicit trusted dispatch only after design acceptance"
status = "deferred"
review_after = "2026-07-01"

[[lane]]
id = "editor-extension-packaging"
owner = "editor/extension"
intent = "Compile, test, and package the read-only saved-lsp viewer extension as a VSIX without publishing"
proof_obligation = "npm install, TypeScript compile, unit tests, and vsce package succeed and produce a VSIX artifact without witness execution, source edits, comment posting, marketplace publication, or write permissions"
cost_estimate = "low"
trigger_policy = "pull_request(paths: editors/vscode/**, .github/workflows/editor-extension.yml), push(main; paths: editors/vscode/**, .github/workflows/editor-extension.yml), workflow_dispatch"
status = "advisory"
review_after = "2026-07-23"

[[lane]]
id = "editor-extension-publish"
owner = "editor/extension"
intent = "Manually publish the editor extension to VS Marketplace and Open VSX from explicit owner dispatch only"
proof_obligation = "workflow runs only on workflow_dispatch from main, refuses to publish unless dry_run=false plus an explicit publish boolean is set, requires VSCE_PAT or OVSX_PAT secrets for the matching publication path, validates package identity, and never publishes on PR or push events"
cost_estimate = "low"
trigger_policy = "workflow_dispatch only with dry_run default true"
status = "deferred"
review_after = "2026-07-23"

[[lane]]
id = "droid-pr-review"
owner = "repo-infra / review-bot"
intent = "Run an owner-requested Factory Droid advisory PR review using the MiniMax M3 BYOK custom model"
proof_obligation = "workflow configures ~/.factory/settings.json with MiniMax-M3, uses the deterministic custom:MiniMax-M3-0 model for review and security review, keeps the advisory review on the shallow preset with low reasoning effort, disables Droid security review blocking, passes the scoped workflow GitHub token to Droid, grants id-token: write for the pinned Factory Droid validator OIDC path, clears ambient Anthropic globals, uses only contents: read, pull-requests: write, and id-token: write repository permissions, bounds the Droid action step with a timeout and continue-on-error, cancels superseded PR review runs, and remains advisory without source edits, witness execution, publishing, or unsafe-review blocking claims"
cost_estimate = "medium"
trigger_policy = "pull_request(opened, synchronize, reopened, ready_for_review) for non-draft PRs"
status = "advisory"
review_after = "2026-07-01"

[[lane]]
id = "action-smoke"
owner = "repo-infra / ci"
intent = "Prove the unsafe-review-first-pr composite action runs end-to-end and sets its bundle_dir and gate_status outputs against this repo"
proof_obligation = "workflow runs on workflow_dispatch only, checks out the repo with full history, runs the local composite action against base_ref main, and asserts bundle_dir and gate_status outputs are non-empty; an empty or zero-card diff is acceptable — the smoke proves the action runs, not that it finds cards; never a required PR gate, never triggers on pull_request or push, no write permissions"
cost_estimate = "medium"
trigger_policy = "workflow_dispatch only"
status = "advisory"
review_after = "2026-08-12"

[[lane]]
id = "corpus-backstop"
owner = "repo-infra"
intent = "Run the fixture corpus on a weekly schedule to collect wall time, output size, and external peak RSS as a resource triage backstop"
proof_obligation = "workflow runs on schedule/dispatch only, is never a required PR gate, produces a resource-report.json artifact, and carries the diagnostic-triage-input-only trust boundary"
cost_estimate = "low"
trigger_policy = "schedule (weekly), workflow_dispatch"
status = "advisory"
review_after = "2026-08-12"

[[lane]]
id = "cache-warming"
owner = "repo-infra"
intent = "Keep the shared ci-gate rust-cache entry warm on main so the ci.yml gate's gh-hosted fallback PR runs start from a warm dependency and check-profile target cache (#1515 candidate 3)"
proof_obligation = ".github/workflows/cache-warm.yml runs on schedule (weekly Monday 04:41 UTC) and workflow_dispatch only, restores and re-saves the shared-key ci-gate rust-cache entry via a bounded cargo fetch --locked + cargo check --workspace --all-targets --locked warm-up with a 30-minute timeout, mirrors the ci.yml workflow-level CARGO env so the rust-cache key hash matches, uses contents: read only, never triggers on pull_request or push, is never a required check, and never gates a merge"
cost_estimate = "low"
trigger_policy = "schedule (weekly Monday 04:41 UTC), workflow_dispatch"
status = "advisory"
review_after = "2026-10-10"

[[lane]]
id = "fuzz"
owner = "repo-infra"
intent = "Run a bounded advisory fuzz pass over the analyze target on a weekly schedule to catch panics and renderer-parseability regressions under adversarial input"
proof_obligation = "workflow runs on schedule/dispatch only, is never a required PR gate, uses pinned rust-toolchain action plus dated nightly toolchain nightly-2026-06-01 (cargo-fuzz requirement, sole nightly exception), runs the job continue-on-error so crashes never fail the advisory lane while the fuzz step reports its true outcome, and uploads crash repros as artifacts; diagnostic robustness input only"
cost_estimate = "low"
trigger_policy = "schedule (weekly), workflow_dispatch"
status = "advisory"
review_after = "2026-08-21"
