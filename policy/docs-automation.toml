schema_version = "1.0"

[scope]
owned_roots = [
  ".rails",
  ".opencode",
  "docs",
  "policy",
  "plans",
  "crates/unsafe-review/README.md",
  "crates/unsafe-review-core/README.md",
  "crates/unsafe-review-cli/README.md",
]
external_awareness_only = [
  ".codex",
  ".spec",
  ".claude",
  ".jules",
]

[[generated_or_checked]]
id = "spec-status-dashboard"
kind = "spec_status_dashboard"
path = "docs/specs/UNSAFE-REVIEW-SPEC-STATUS.md"
mode = "check"
sources = [
  ".allow/artifacts/doc-artifacts.toml",
  ".allow/artifacts/doc-artifacts.toml",
  ".allow/goals/active.toml",
  "docs/specs",
  "docs/handoffs",
]
must_include = [
  "UNSAFE-REVIEW-SPEC-0020",
  "Proof commands",
  "Machine Check",
  "check-spec-status",
]

[[generated_or_checked]]
id = "spec-start-here"
kind = "operator_front_door"
path = "docs/specs/UNSAFE-REVIEW-SPEC-START-HERE.md"
mode = "check"
sources = [
  ".allow/goals/active.toml",
  ".allow/artifacts/doc-artifacts.toml",
  "docs/specs",
]
must_include = [
  "The selected GitHub issue or PR",
  "linked issue-work specification",
  ".allow/goals/active.toml",
  "cargo-allow worklist",
  "neither selects, blocks, or schedules the task",
  "user-carried or explicitly adopted workplan",
  "current GitHub issue/PR/check",
  "Runtime goal state is descriptive only.",
]

[[generated_or_checked]]
id = "agent-operating-contract"
kind = "agent_operating_contract"
path = "AGENTS.md"
mode = "check"
sources = [
  "docs/contributing/SWARM_TO_MAIN.md",
  "docs/contributing/spec-rails.md",
  "docs/specs/UNSAFE-REVIEW-SPEC-0024-ci-design.md",
  "docs/contributing/AGENT-ORCHESTRATION.md",
]
must_include = [
  "unsafe-review-swarm develops.",
  "unsafe-review publishes.",
  "cargo run --locked -p xtask -- source-divergence",
  "Use the repo source-of-truth stack",
  "Do not put durable repo operating state in `.codex`",
  "`ReviewCard` is the canonical product unit",
  "configuration obstacle",
  "docs/specs/UNSAFE-REVIEW-SPEC-0024-ci-design.md",
  "zero active work items is a valid repository state",
  "PR batches on `unsafe-review-swarm` are expected input",
  "Spec rails are meant to make routine progress easier, not ceremonial.",
  "Do not reject a useful generated PR just because it references missing but",
  "Do not stop at \"human merge required\"",
  "Coordination is execution",
  "A user-carried workplan is actionable direction",
  "Runtime goal and progress state is descriptive, never authority",
  "A running check is `in_progress`, not `blocked`",
  "Capability claims require an attempted operation and concrete failure evidence",
  "Independent review does not mean human review",
  "Authority boundaries retain object identity",
  "Stop for the owner decision",
  "Progress measures the full user-defined outcome",
]

[[generated_or_checked]]
id = "agent-orchestration-protocol"
kind = "agent_operating_contract"
path = "docs/contributing/AGENT-ORCHESTRATION.md"
mode = "check"
sources = [
  "AGENTS.md",
  "docs/contributing/LIFECYCLE_SURFACE_MAP.md",
  "docs/specs/UNSAFE-REVIEW-SPEC-0044-issue-linked-work-specs.md",
]
must_include = [
  "Coordination is execution",
  "Runtime goal, status, and progress surfaces are descriptive only",
  "A pending or running hosted check is in progress, not blocked",
  "Capability claims require receipts",
  "Independent review does not mean human review",
  "Authority boundaries retain object identity",
  "Stop for the owner decision",
  "do not invent a human-only merge requirement",
]

[[generated_or_checked]]
id = "opencode-coordinator-adapter"
kind = "agent_operating_contract"
path = ".opencode/agents/coordinator.md"
mode = "check"
sources = [
  "AGENTS.md",
  "docs/contributing/AGENT-ORCHESTRATION.md",
]
must_include = [
  "Coordination is execution",
  "Runtime goal/progress state is descriptive only",
  "Use `blocked` only after a required operation was attempted",
  "Independent review may be agentic or human",
  "Authority remains object-specific",
  "Stop for the owner decision",
]

[[generated_or_checked]]
id = "legacy-goals-archive"
kind = "operator_front_door"
path = ".rails/goals/README.md"
mode = "check"
sources = [
  ".rails/README.md",
  "AGENTS.md",
]
must_include = [
  "Legacy goals archive",
  "not a current execution front door",
  "Do not begin work by reading `.rails/goals/active.toml`",
  "selected live GitHub issue or PR",
  "must not be projected into runtime goal state",
]

[[generated_or_checked]]
id = "accuracy-calibration-plan"
kind = "lane_plan"
path = ".rails/lanes/accuracy-calibration/implementation-plan.md"
mode = "check"
sources = [
  "policy/accuracy-calibration.toml",
  "docs/specs/UNSAFE-REVIEW-SPEC-0026-accuracy-validation-and-calibration.md",
  "xtask/src/main.rs",
]
must_include = [
  "allowed public claim wording that omits the claim level",
  "forbidden claim lists that omit shared global precision, global recall, and",
  "memory-safety proof overclaim boundaries",
  "fixture-pinned claims",
  "allowed public claim wording that contains global precision/recall",
]

[[generated_or_checked]]
id = "docs-map"
kind = "docs_map"
path = "docs/README.md"
mode = "check"
sources = [
  "docs",
  ".allow/artifacts/doc-artifacts.toml",
]
must_include = [
  "First-use",
  "CLI",
  "Support",
  "Specs",
]

[[generated_or_checked]]
id = "published-facade-readme"
kind = "published_surface"
path = "crates/unsafe-review/README.md"
mode = "check"
sources = [
  "README.md",
  "crates/unsafe-review/Cargo.toml",
]
must_include = [
  "Advisory unsafe-contract review",
  "cargo install unsafe-review --locked",
  "unsafe-review pr",
  "Trust boundary",
  "proof of memory safety",
  "UB-free claim",
  "Miri result",
]

[[generated_or_checked]]
id = "release-publication-receipts"
kind = "handoff_receipt"
path_glob = "docs/handoffs/*publication*.md"
mode = "check"
must_include = [
  "Pre-publish verification",
  "Trust boundary",
  "Post-publish smoke",
]
