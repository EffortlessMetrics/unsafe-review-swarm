schema_version = "1.0"
policy = "spec-coverage"
owner = "core / analysis"

# The ReviewCard is the single truth object; surfaces PROJECT pipeline truth,
# they do not recompute it. `check-spec-coverage` rejects fields without a
# canonical source, an emitting surface, or the single-truth invariant. The
# consumer inventory below records aliases, aggregate/formatting-only surfaces,
# and deliberately uncovered or parked consumers without pretending that the
# structural gate proves cross-consumer behavior.

[[field]]
name = "severity"
canonical_source = "domain/classification.rs::ReviewClass::sarif_level / ::lsp_severity"
surfaces = ["sarif", "lsp", "json"]
single_truth = true

[[field]]
name = "priority"
canonical_source = "domain/review_card.rs::ReviewCard.priority (set by analysis/pipeline/card_builder.rs)"
surfaces = ["sarif", "json", "agent", "comment_plan", "repair_queue", "outcome", "lsp", "review_kit"]
single_truth = true

[[field]]
name = "coverage_movement"
canonical_source = "domain/coverage.rs::CoverageBlock::derive -> derive_outcome_movement"
surfaces = ["json", "agent", "lsp", "usefulness_telemetry"]
single_truth = true
note = "policy_report does not project outcome_movement; it projects baseline_state only via its own derivation (see baseline_state entry)"

[[field]]
name = "baseline_state"
canonical_source = "domain/coverage.rs::CoverageBlock::derive -> derive_baseline_state"
surfaces = ["json", "agent", "policy_report", "lsp"]
single_truth = true
note = "All three surfaces (json, agent, policy_report) project CoverageBlock::derive with snapshot-slot movement. Policy classification (new_gap/baseline_known/suppressed/non_actionable) is carried by policy_report.policy_status and policy_report.policy_reason."

[[field]]
name = "agent_readiness"
canonical_source = "domain/coverage.rs::compute_agent_lsp_readiness"
surfaces = ["json", "agent", "lsp", "usefulness_telemetry", "review_kit"]
single_truth = true
note = "shared fn enforces parity across coverage block + agent packet; lsp does not expose per-card agent_readiness via compute_agent_lsp_readiness"

[[field]]
name = "comment_plan_status"
canonical_source = "output/comment_plan/mod.rs::card_statuses"
surfaces = ["json", "agent", "comment_plan", "lsp", "usefulness_telemetry"]
single_truth = true

[[field]]
name = "unsafe_sites"
canonical_source = "analysis/pipeline/summary.rs::summarize (scanned_sites, pre-cap)"
surfaces = ["json"]
single_truth = true

[[field]]
name = "receipt_status"
canonical_source = "analysis/receipts.rs::ReceiptAuditReport"
surfaces = ["receipt_audit"]
single_truth = true
note = "audit-time metadata, not a per-card field"

[[field]]
name = "card_identity"
canonical_source = "domain/review_card.rs::ReviewCard.id (analysis/pipeline/card_identity.rs)"
surfaces = ["json", "pr_summary", "github_summary", "comment_plan", "repair_queue", "lsp", "sarif", "agent", "outcome", "witness_plan", "review_kit"]
single_truth = true
note = "All editor, packet, queue, SARIF, and PR projections join by the exact ReviewCard ID; the saved VS Code adapter must preserve this identity rather than infer it from position."

[[field]]
name = "site_location"
canonical_source = "domain/operation.rs::UnsafeSite.location and owner (analysis/pipeline/card_builder.rs)"
surfaces = ["json", "pr_summary", "github_summary", "comment_plan", "repair_queue", "lsp", "sarif", "agent", "outcome", "witness_plan", "review_kit"]
single_truth = true
note = "File, range, owner, visibility, and changed-line state are card facts. Saved/live LSP and VS Code adapters project the same range; none may infer binding from nearby lines or hover prose."

[[field]]
name = "rule_class_code"
canonical_source = "domain/classification.rs::ReviewClass::as_str"
surfaces = ["json", "pr_summary", "github_summary", "comment_plan", "repair_queue", "lsp", "sarif", "agent", "outcome", "witness_plan", "review_kit"]
single_truth = true
note = "The stable diagnostic code is the canonical class/rule code. Severity remains a separate ReviewClass projection; adapters must not replace either with priority or operation family."

[[field]]
name = "operation_family"
canonical_source = "domain/operation.rs::UnsafeOperation.family.as_str()"
surfaces = ["json", "pr_summary", "github_summary", "comment_plan", "repair_queue", "lsp", "sarif", "agent", "outcome", "ub_review", "witness_plan", "review_kit"]
single_truth = true
note = "Operation family is card-owned and additive. It is descriptive context, not a replacement for class, severity, readiness, or repair applicability."

[[field]]
name = "review_class"
canonical_source = "domain/classification.rs::ReviewClass (analysis/pipeline/card_builder.rs)"
surfaces = ["json", "pr_summary", "github_summary", "comment_plan", "repair_queue", "lsp", "sarif", "agent", "outcome", "witness_plan", "review_kit"]
single_truth = true
note = "ReviewClass owns class-derived severity and actionability. Saved LSP, live LSP, VS Code, agent, SARIF, and PR consumers must project it without reclassification."

[[field]]
name = "surfacing_disposition"
canonical_source = "output/comment_plan/mod.rs::card_statuses (output/comment_plan/selection.rs)"
surfaces = ["json", "comment_plan", "agent", "lsp", "pr_summary", "github_summary"]
single_truth = true
note = "Selected, not_selected, and not_eligible are reviewer-routing states. They must remain distinct from analyzer class and from human/agent readiness."

[[field]]
name = "next_action"
canonical_source = "domain/review_card.rs::ReviewCard.next_action (analysis/pipeline/card_builder.rs)"
surfaces = ["json", "pr_summary", "github_summary", "comment_plan", "repair_queue", "lsp", "agent", "outcome", "witness_plan", "review_kit"]
single_truth = true
note = "The summary and verify commands are card-owned handoff facts. Renderers may format them, but may not invent repairs or broaden their target."

[[field]]
name = "repair_applicability"
canonical_source = "output/agent/queue.rs::repair_queue_projection (AgentQueueProjection)"
surfaces = ["json", "repair_queue", "lsp", "agent", "pr_summary", "github_summary", "review_kit"]
single_truth = true
note = "Buckets, bounded allowed-repair hints, typed repair candidates, and readiness are derived from the shared repair projection. The repair queue, agent packet, saved/live LSP action data, VS Code adapter, and PR artifacts must not classify applicability independently."

[[field]]
name = "freshness_identity"
canonical_source = "api.rs::AnalyzeOutput.analysis_identity / freshness.rs::AnalysisIdentity"
surfaces = ["json", "lsp", "agent"]
single_truth = true
note = "Saved LSP and agent packets project the shared per-analysis identity. Live LSP, VS Code freshness presentation, document versions, and stale/failure transitions remain later #1908 slices; the identity is a signal, not a safety or currentness guarantee."

[[field]]
name = "missing_evidence"
canonical_source = "domain/review_card.rs::ReviewCard.missing"
surfaces = ["json", "pr_summary", "github_summary", "comment_plan", "repair_queue", "lsp", "sarif", "agent", "witness_plan", "review_kit"]
single_truth = true
note = "Missing evidence is typed card data. Consumers may format it for humans or LLMs, but may not replace it with a prose-derived obligation, severity, or repair bucket."

[[field]]
name = "witness_receipt_coverage"
canonical_source = "domain/coverage.rs::CoverageBlock::derive -> WitnessReceiptCoverage"
surfaces = ["json", "comment_plan", "repair_queue", "lsp", "agent", "pr_summary", "github_summary", "usefulness_telemetry"]
single_truth = true
note = "Receipt coverage is imported metadata for the exact card; it is not evidence that unsafe-review executed a witness."

[[field]]
name = "editor_action_contract"
canonical_source = "output/lsp/action_contract.rs::actions_for_card"
surfaces = ["json", "lsp", "agent"]
single_truth = true
note = "Stable action ID, kind, diagnostic association, readiness, applicability, and disabled reason belong to one action contract. Saved/live LSP and VS Code must preserve it; command-only and edit-free remain ADR-0006 constraints."

[[field]]
name = "declaration_summary_group"
canonical_source = "output/declaration_summary.rs::declaration_groups (derived from ReviewCard.operation.family, domain/coverage.rs::CoverageBlock::derive contract_coverage/baseline_state)"
surfaces = ["pr_summary"]
single_truth = true
note = "Presentation-only grouping (issue #1895) of unsafe_declaration-family ReviewCards by source file. total/new_or_worsened/inherited/contract_missing/contract_present/representatives are all counted from the same CoverageBlock derivation every other baseline-movement surface uses; the group is not a second classifier and cards.json remains the complete per-declaration inventory."

[[field]]
name = "target_feature_summary_group"
canonical_source = "output/target_feature_summary.rs::target_feature_groups (derived from ReviewCard.operation.family, domain/coverage.rs::CoverageBlock::derive class/baseline_state/coverage slots, and a normalized attribute shape)"
surfaces = ["pr_summary", "comment_plan"]
single_truth = true
note = "Presentation-only grouping (issue #1894) of target_feature-family ReviewCards by source file, review class, and a normalized attribute shape (architecture/feature literals are metadata, not identity). Groups never collapse cards whose obligation, class, movement, baseline state, receipt state, or next action differ. total/representatives/underlying_card_ids are counted from the same CoverageBlock derivation every other baseline-movement surface uses; the group is not a second classifier, cards.json remains the complete per-site inventory, and the comment-plan's grouped_repetition selection reads the identical group membership so the two surfaces cannot drift on which card is the representative."

[[field]]
name = "trust_boundary"
canonical_source = "output/mod.rs::REVIEWCARD_TRUST_BOUNDARY and surface-specific fixed boundary constants"
surfaces = ["json", "pr_summary", "github_summary", "comment_plan", "repair_queue", "lsp", "sarif", "agent", "badges", "gate_manifest", "action", "ub_review", "usefulness_telemetry", "witness_plan", "review_kit"]
single_truth = true
note = "Every saved/live/editor, agent, queue, SARIF, PR, and external artifact surface carries the advisory boundary. A renderer may narrow it, never strengthen it into safety, execution, or automatic-repair proof."

# The editor adapter is intentionally represented by the existing `lsp`
# surface vocabulary. The named consumers are saved lsp.json, live
# unsafe-review-cli LSP, editors/vscode, agent packets, repair_queue, SARIF,
# and PR artifacts; they are not independent semantic surfaces.

# Canonical consumer inventory from issue #1880. `surface` links a consumer to
# the field entries above. `aggregate_projection`, `routing_manifest`, and
# `formatting_sidecar` mean the consumer does not emit a complete per-card
# projection. `uncovered`, `partial`, and `parked` are not passes; each routes
# to a builder-ready or existing issue instead of adding unproved surfaces to
# individual field entries.

[[consumer]]
name = "cards_json"
surface = "json"
disposition = "mapped"
note = "Canonical machine-readable ReviewCard set; other first-PR artifacts project from these card identities."

[[consumer]]
name = "human_cli"
surface = "human"
disposition = "uncovered"
follow_up = "https://github.com/EffortlessMetrics/unsafe-review-swarm/issues/2114"
note = "The direct human renderer consumes ReviewCards, but its emitted field subset is not yet locked to this map."

[[consumer]]
name = "markdown_pr_summary"
surface = "pr_summary"
disposition = "mapped"
note = "Human-readable PR Markdown may group or format cards but does not own classification, movement, or readiness."

[[consumer]]
name = "github_summary"
surface = "github_summary"
disposition = "mapped"
note = "GitHub summary projection shares ReviewCard semantics with the PR Markdown surface."

[[consumer]]
name = "comment_plan_json"
surface = "comment_plan"
disposition = "mapped"
note = "Plan-only selection surface; comment eligibility and surfacing disposition remain separate from ReviewClass."

[[consumer]]
name = "repair_queue_json"
surface = "repair_queue"
disposition = "mapped"
note = "ReviewCard-only queue. manual-repair-queue.json is a separate manual-candidate sidecar and is out of scope for this map."

[[consumer]]
name = "saved_lsp_json"
surface = "lsp"
disposition = "mapped"
note = "Saved editor projection; shares the lsp semantic surface with live LSP and the VS Code adapter."

[[consumer]]
name = "live_lsp_and_vscode"
surface = "lsp"
disposition = "mapped"
note = "Live/editor adapters preserve the shared LSP diagnostic and action contract; transport and freshness lifecycle are separate concerns."

[[consumer]]
name = "cards_sarif"
surface = "sarif"
disposition = "mapped"
note = "SARIF rule code and level remain class-derived; PR #1770 is the existing SARIF/LSP severity drift lock."

[[consumer]]
name = "badges"
surface = "badges"
disposition = "aggregate_projection"
note = "Badge counts summarize card-derived coverage posture and carry no per-card repair, readiness, or safety claim."

[[consumer]]
name = "policy_report"
surface = "policy_report"
disposition = "aggregate_projection"
note = "Projects baseline/policy posture without owning ReviewCard classification or outcome movement."

[[consumer]]
name = "usefulness_telemetry_json"
surface = "usefulness_telemetry"
disposition = "aggregate_projection"
note = "Maps only aggregate coverage movement, agent readiness, comment selection status, witness-receipt coverage, and the advisory trust boundary. Actionability duplicates a private ReviewClass match and is parked pending the parity lock in #2118; confidence, coverage-slot, unfulfilled-obligation, and CLI-owned scan-cost aggregates have no dedicated field row and remain parked from per-card parity. Per-card identity, location, priority, operation family, missing-evidence list, next action, repair applicability, freshness identity, and editor action are absent/parked from this diagnostic count artifact."

[[consumer]]
name = "unsafe_review_gate_json"
surface = "gate_manifest"
disposition = "routing_manifest"
note = "Thin artifact-routing manifest; paths, kinds, and schema versions require the compatibility contract tracked by #2115."

[[consumer]]
name = "witness_plan_markdown"
surface = "witness_plan"
disposition = "mapped"
note = "Maps ReviewCard identity, location, class/code, operation family, missing evidence, next action, and the advisory trust boundary into a complete witness-routing plan. Proof-path, hazard, witness-route, and obligation-evidence details have no dedicated field row and remain parked from this parity map; the plan does not execute witnesses."

[[consumer]]
name = "review_kit_json"
surface = "review_kit"
disposition = "aggregate_projection"
note = "Maps a bounded ReviewCard queue with identity, location, class/code, priority, operation family, missing evidence, next action, agent readiness, repair applicability, and the advisory trust boundary, plus aggregate counts and copy-only handoff commands. Confidence and witness-route details have no dedicated field row and remain parked from this parity map; omitted cards remain in cards.json."

[[consumer]]
name = "reviewcard_agent_packet"
surface = "agent"
disposition = "mapped"
note = "ReviewCard agent/context packet emitted by output/agent.rs::render_with_output; it preserves card identity, evidence, readiness, and repair projection."

[[consumer]]
name = "tokmd_packets_json"
surface = "manual_candidate"
disposition = "formatting_sidecar"
note = "ManualCandidate formatting input with analyzer_discovered=0; it is not the ReviewCard agent packet, rendered tokmd output, or a second classifier."

[[consumer]]
name = "public_action"
surface = "action"
disposition = "parked"
follow_up = "https://github.com/EffortlessMetrics/unsafe-review-swarm/issues/1878"
note = "No public Action or released-binary consumer claim is active; the current map records only the advisory trust boundary."

[[consumer]]
name = "ub_review"
surface = "ub_review"
disposition = "partial"
follow_up = "https://github.com/EffortlessMetrics/unsafe-review-swarm/issues/2116"
note = "Operation-family and trust-boundary intent are mapped, but a pinned real producer/consumer smoke is not yet proven."

[[gap]]
name = "human_cli_field_parity"
status = "builder_ready"
follow_up = "https://github.com/EffortlessMetrics/unsafe-review-swarm/issues/2114"

[[gap]]
name = "artifact_schema_identity_and_compatibility"
status = "builder_ready"
follow_up = "https://github.com/EffortlessMetrics/unsafe-review-swarm/issues/2115"

[[gap]]
name = "ub_review_real_consumer_smoke"
status = "builder_ready"
follow_up = "https://github.com/EffortlessMetrics/unsafe-review-swarm/issues/2116"

[[gap]]
name = "usefulness_actionability_projection_parity"
status = "builder_ready"
follow_up = "https://github.com/EffortlessMetrics/unsafe-review-swarm/issues/2118"
