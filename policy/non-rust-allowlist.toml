schema_version = "0.1"
policy = "non-rust-allowlist"
owner = "core/policy"

[[allow]]
id = "non-rust-0001"
glob = "docs/**"
kind = "documentation"
language = "markdown"
surface = "docs"
classification = "trusted-docs"
owner = "core/docs"
reason = "Documentation is required source of truth."
covered_by = "cargo xtask check-docs"
created = "2026-05-17"
