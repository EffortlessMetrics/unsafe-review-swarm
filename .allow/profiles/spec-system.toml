schema_version = "1.0"
profile = "spec-system"
mode = "advisory"

[roots]
proposals = "docs/proposals"
specs = "docs/specs"
adrs = "docs/adr"
plans = "plans"
goals = ".allow/goals"
support_tiers = "docs/status/SUPPORT_TIERS.md"
artifact_ledger = ".allow/artifacts/doc-artifacts.toml"

[requirements]
ledger_required = true
templates_required = true
support_tiers_required = true
# The current cargo-allow release names this compatibility slot
# `active_goal_required`. In this repository it validates a neutral project
# charter, not a default issue, queue, or controller operation. A future
# cargo-allow profile may make this optional or support multiple charters.
active_goal_required = true
closeout_required_for_done_items = true

[import_roots]
owned = ".allow/imports"

[[import_roots.entries]]
id = "owned-imports"
path = ".allow/imports"
ecosystem = "cargo-allow"
role = "owned"
