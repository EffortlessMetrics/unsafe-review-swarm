decision_2404_toml = "deferred to freeze examination: 1.1.5->1.1.8+spec-1.1.0 includes a parser unsoundness-risk fix (synthetic parser events) and display key-encoding fixes plus perf work. Rationale for care: config parsing soundness; config/policy-manifest round-trip tests plus check-pr are the reset receipts."
decision_2404_proptest = "deferred to freeze examination: 1.11.0->1.12.0 (dev-only property testing; rand_chacha->chacha20 swap, fork-replay fix). Lowest product risk; dev-suite green suffices."
decision_2404_serde_json = "deferred to freeze examination: 1.0.151->1.0.154 (UTF-8 error positions, -0 sign, float/INFINITY comparison). Output-rendering adjacent; golden/snapshot tests plus check-pr are the reset receipts."
decision_2404_sha2 = "deferred to freeze examination: 0.11.0->0.11.1 (AArch64 round-constant loading fix, unsafe_op_in_unsafe_fn lint fix with MSRV 1.88 note). Rationale: digest output feeds badge/proof hashing; hash-golden tests plus check-pr are the reset receipts. Does not inherit the #2135 sha2-0.10.9-subtree authorization."
no_blanket_merge = "Recorded per the issue: the group label patch/minor never substitutes for per-package behavior evidence."

[version_verdict]
proposed = "0.6.0"
standing = "proposed-only; not frozen, not published, not tagged"
split = "Workbench manifests read 0.3.8 at 9a0f5bf4 while the public registry holds 0.5.0; the 0.5.0 bump lived on the non-ancestor release-prep side branch (#571), never as a workbench-main version commit. The 0.6 convention follows the same shape: the bump lands with release-prep on its side branch when the API/CLI/schema/MSRV assessment settles the number; this slice forces no bump."
settlement_inputs = ["API/CLI/schema/MSRV assessment per issue #2401 acceptance", "freeze amendment rules below", "#2400 integration baseline"]

[[rule]]
id = "FREEZE-2401-1"
text = "This inventory freezes nothing. A follow-up PR refreshes bases, included commits, package/lockfile identities, schema/consumer matrix, required acceptance IDs, and optional omissions, and only then flips status to frozen."

[[rule]]
id = "FREEZE-2401-2"
text = "After freeze, changes require a bounded amendment naming the defect, the changed packaged bytes/contracts, and the affected proof. Rerun invalidated evidence; never reset unrelated successful rows without a reason, and never rebind old runs to a new SHA by editing dates."

[[rule]]
id = "FREEZE-2401-3"
text = "0.4.0/0.5.0 receipts, handoffs, and CHANGELOG entries are immutable; the new cutline only adds. Stale in-place panels (docs/status/*) are read as evidence only and are reconciled by #2398, never refreshed as the freeze record."

[[rule]]
id = "BOUNDARY-2401"
text = "This record proves inventory accuracy via offline checkers and the documented gates. It performs no registry upload, source release merge, tag/Release/v1 movement, runner-policy expansion, support/calibration promotion, or release qualification; it makes no safety, UB-free, Miri-clean, site-execution, precision/recall, or policy-readiness claim."

claim_boundary = "unsafe-review finds unsafe Rust changes missing a safety contract, guard, test, or witness. This cutline states what 0.6 would ship and freeze; it establishes nothing beyond the audited facts above."
