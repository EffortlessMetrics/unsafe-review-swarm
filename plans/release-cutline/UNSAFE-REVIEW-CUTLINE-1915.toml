# `disposition` answers "is this required to qualify the candidate?" and is an
# owner decision. `integration` answers the separate factual question "is this
# work present on swarm main today?" and is refreshed from the git log at each
# audit. The two are independent: deferred work can still be integrated, and
# required work can still be absent. Conflating them is what made the previous
# snapshot misleading.
#
# integration values:
#   on_swarm_main         - the issue's PR sequence appears complete on swarm main
#   partial_on_swarm_main - some slices landed; named slices remain outstanding
#   not_on_swarm_main     - no matching work found on swarm main
#   open_pr               - work exists only on an unmerged PR branch
#
# Where a commit does not cite its issue number, `integration_evidence` names
# the commits matched by scope and title and says so explicitly. Those are
# attributions, not citations.

