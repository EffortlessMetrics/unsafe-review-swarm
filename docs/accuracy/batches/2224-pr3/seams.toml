# no seam (recorded as an excluded consideration in mapping, not a row here).

# smallvec-768 S1: from_buf_and_len_unchecked is a pub const unsafe fn whose
# signature and contract change (buf: MaybeUninit<[Item; INLINE]> becomes
# [MaybeUninit<Item>; INLINE]; Safety section keeps the length/init claims).
# The union field retype and constructor renames are safe code and contribute
# no seam beyond this declaration. debug_assert!(length <= INLINE) is a
# debug-only guard: mapping must judge whether the card respects that limit
# (cf. the PR1 getrandom debug_assert lesson), not this inventory.
[[seams]]
id = "smallvec-768-S1"
case = "smallvec-768"
source_anchor = "src/lib.rs pub const unsafe fn from_buf_and_len_unchecked(buf: [MaybeUninit<Item>; INLINE], length: usize) with retained Safety section and debug_assert!(length <= INLINE)"
operation_family = "unsafe_declaration"
obligation_keys = ["caller-contract"]
expected_contract = "present"
expected_discharge = "present"
rationale = "Changed unsafe declaration: the buffer representation in the signature changes while the Safety section still places length/init on the caller. A correct card reports the caller-held obligations and may credit the debug_assert as a debug-only guard; treating the assert as a release guarantee would be over-credit."
inclusion = "include"
