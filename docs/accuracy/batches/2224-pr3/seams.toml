# bytemuck-258 S1: the Drop::drop dealloc call itself is edited (dominating
# zero-size guard added, SAFETY comment retargeted), so the site is in review
# scope. There is no canonical dealloc family (schema known-gap
# dealloc-family); the site is inventoried as unsafe_fn_call because dealloc
# is an unsafe fn, with the ownership/allocation adequacy judged from the
# SAFETY comment rather than the family name.
[[seams]]
id = "bytemuck-258-S1"
case = "bytemuck-258"
source_anchor = "src/allocation.rs Drop for BoxBytes::drop: if self.layout.size() != 0 { unsafe { alloc::alloc::dealloc(self.ptr.as_ptr(), self.layout) } } with retargeted SAFETY comment"
operation_family = "unsafe_fn_call"
obligation_keys = ["callee-contract"]
expected_contract = "present"
expected_discharge = "present"
rationale = "UB-fix site: the dominating size check establishes that ptr was allocated with layout (the ZST dangling case is excluded), and the SAFETY comment carries the ownership adequacy. A correct card credits the dominating guard and must not demand a redundant check; crediting the pre-fix comment shape would be stale evidence."
inclusion = "include"

# The bytemuck-258 regression test (box_bytes_zst) calls safe public APIs
