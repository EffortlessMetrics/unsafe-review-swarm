# #2224 PR2 seam-denominator batch manifest.
#
# Second growth increment: six pinned real PRs across three new projects
# (crossbeam, bytes, parking_lot) plus a comment-only quiet control,
# covering families PR1 did not exercise: unsafe_impl_send_sync,
# copy_nonoverlapping, raw_pointer_deref in epoch reclamation, and
# uninitialized-buffer advance/write guard discipline. Source-first expected
# seams live in seams.toml; card-to-seam mapping in mapping.toml; frozen
# first-run outputs under outputs/. Matching rules and the four baseline
# questions live in protocol.md.
schema_version = "seam-batch/v1"
issue = "https://github.com/EffortlessMetrics/unsafe-review-swarm/issues/2224"
protocol = "docs/accuracy/batches/2224-pr2/protocol.md"
partition = "growth"
label_status = "agent-drafted source-first; not human adjudication"
trust_boundary = "Static unsafe contract review only. This batch measures ReviewCard seam recall, emitted-card correctness, obligation over-credit, selection usefulness, duplicates, and quiet-PR false alarms on six pinned PRs. It is not calibrated precision or recall, not a proof of memory safety, not UB-free status, not a Miri result, not Miri-clean status, not site-execution evidence, not witness adequacy, not policy readiness, and not a merge verdict for any sampled PR."

[acquisition]
method = "read-only gh pr diff fetch plus pinned-head local checkout for analyzer --root"
network_on_check_path = false
diff_dir = "docs/accuracy/batches/2224-pr2/diffs"

[analyzer]
# Pinned at freeze time. The published-0.4.0 fixed-comparison slot is
# reserved but unfilled: 0.4.0 is not yet published. The frozen baseline is
# the exact development revision below.
binary = "target/debug/unsafe-review"
version = "0.3.8"
revision = "09d30034fca6983a860bb94126b657d4f962aec9"
revision_role = "exact development revision (origin/main at batch time)"
fixed_comparison_040 = "unfilled: 0.4.0 not yet published; manifest reserves outputs/outputs-0.4.0/ for the comparison run"

[run_config]
command_shape = "cargo run --locked -p unsafe-review -- check --root <head-checkout> --diff <case-diff> --format json --out <frozen-output>"
caps = "default analyzer caps; no timeouts hit; no witness execution"

[[cases]]
