id = "hashbrown-692-S1"
case = "hashbrown-692"
source_anchor = "src/raw.rs ctrl_slice: slice::from_raw_parts_mut(self.ctrl.as_ptr().cast(), self.num_ctrl_bytes())"
operation_family = "slice_from_raw_parts_mut"
obligation_keys = ["buffer_validity", "initialized_memory", "alignment"]
expected_contract = "present"
expected_discharge = "partial"
rationale = "Changed safety contract around a live from_raw_parts_mut: the count claim stays in the SAFETY comment but the initialized claim is gone, replaced structurally by the MaybeUninit return type. A correct card credits the comment for the count obligation only and must not credit it for initialization."
inclusion = "include"

